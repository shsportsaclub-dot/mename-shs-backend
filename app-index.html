<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoring Heroes – Sports Sky High</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050c26;--card:#0b1a45;--c2:#12266a;--tx:#eef2ff;--mu:#93a1c9;--ac:#ff3b50;--ac2:#ffc83d;--bd:#1d3077;--rd:#ff3b50;--gn:#22c55e;--on:#ffffff;--bl:#3f7bff;--grad:linear-gradient(90deg,#0a1f5c 0%,#1a2a7a 28%,#6a1b54 62%,#e11d2e 100%);--dsp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
body.ovpage{background:transparent;overflow:hidden}
h1,h2,h3{margin:0;font-family:var(--dsp);letter-spacing:.3px}
h2{font-size:26px}h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:2px}
#app{max-width:1000px;margin:0 auto;padding:0 0 96px}
main{padding:12px}
.hdr{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--grad);position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:2px solid var(--ac)}
.hlogo{display:block;cursor:pointer}
.hlogo img{height:34px;width:auto;display:block;filter:drop-shadow(0 2px 6px #0007)}
.iconbtn{background:#ffffff1f;border:0;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;color:#fff;position:relative}
.iconbtn svg,.bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--ac2)}
.me{font-weight:800;font-family:var(--dsp);font-size:18px}
.grow{flex:1}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--bd);margin:12px 0;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 13px;color:var(--mu);white-space:nowrap;font-weight:600}
.tabs button.on{color:#fff;border-bottom-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{display:flex;gap:8px;align-items:center;margin:4px 0 12px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.mu{color:var(--mu)}.sm{font-size:12px}.b{font-weight:700}.r{text-align:right}.c{text-align:center}
.btn{background:var(--grad);color:#fff;border:0;border-radius:10px;padding:10px 15px;font-weight:700}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.red{background:var(--rd)}
.btn.gold{background:var(--ac2);color:#1b1500}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.wide{width:100%;margin-top:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{background:#0a1646;border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
label{display:block;font-size:12px;color:var(--mu);margin-top:10px}
label>input,label>select,label>textarea{margin-top:4px;font-size:14px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--tx);margin:4px 0}
label.ck input{width:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--mu);font-weight:600}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.empty{padding:28px 12px;text-align:center;color:var(--mu);border:1px dashed var(--bd);border-radius:12px}
.score{font-family:var(--dsp);font-size:46px;font-weight:700;line-height:1;color:#fff}
.ovr{font-size:17px;color:var(--mu);margin-left:6px}
.status{font-family:var(--dsp);font-size:28px;font-weight:700;color:var(--ac2);text-align:right}
.need{background:#ffc83d1f;color:var(--ac2);text-align:center;padding:10px;font-weight:600;border-radius:8px;margin:10px 0}
.stats{display:flex;justify-content:space-between;color:var(--mu);margin-top:10px;font-size:13px}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.ch{min-width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-weight:600;font-size:13px;padding:0 4px}
.ch.f{background:var(--bl);color:#fff;border-color:var(--bl)}
.ch.s{background:var(--ac2);color:#1b1500;border-color:var(--ac2)}
.ch.w{background:var(--ac);color:#fff;border-color:var(--ac)}
.ch.x{border-style:dashed;color:var(--ac2)}
.pbar{display:flex;height:28px;border-radius:7px;overflow:hidden;font-weight:700;font-size:12px}
.pbar>div{display:grid;place-items:center;color:#fff;min-width:28px}
.ticker{background:var(--ac2);color:#1b1500;padding:8px 12px;border-radius:8px;font-weight:600;margin-bottom:10px}
.ticker.alert{background:var(--ac);color:#fff}
.logo{border-radius:6px;object-fit:cover;vertical-align:middle}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--c2);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--c2);font-size:11px;font-weight:600}
.pill.live{background:var(--ac);color:#fff}
.pill.ok{background:var(--gn);color:#06220f}
.pill.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.55}}
.runs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.runs button{height:54px;font-size:20px;font-weight:700;border-radius:10px;border:1px solid var(--bd);background:var(--c2)}
.runs button.four{background:var(--bl);border-color:var(--bl);color:#fff}
.runs button.six{background:var(--ac2);color:#1b1500;border-color:var(--ac2)}
.exr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.exr button{padding:11px 4px;border-radius:10px;border:1px solid var(--bd);background:var(--c2);font-weight:700}
.exr button.on{background:var(--ac2);color:#1b1500;border-color:var(--ac2)}
.exr button.wk{background:var(--ac);color:#fff;border-color:var(--ac)}
.modalbg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:60;padding:12px}
.modal{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#fff;color:#0a1f5c;padding:9px 14px;border-radius:99px;font-weight:700;box-shadow:0 4px 18px #0008}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:inline-block}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick button{padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--c2);text-align:left}
.pick button:hover:not([disabled]){border-color:var(--ac)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px}
.kv>:nth-child(odd){color:var(--mu)}
svg text{font-family:var(--ui)}
.chart{width:100%;height:auto}
.bignum{font-family:var(--dsp);font-size:34px;font-weight:700;color:#fff}
.hero{background:var(--grad);border-radius:16px;padding:16px;position:relative;overflow:hidden;margin-bottom:12px}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:#ffffff14}
.hero>*{position:relative;z-index:1}
.sec{display:flex;align-items:center;margin:16px 0 8px}
.sec h3{flex:1}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tile{flex:none;width:84px;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;font-size:12px;font-weight:600;color:var(--tx)}
.tile.on{border-color:var(--ac)}
.tile.off{opacity:.55}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qgrid button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 4px;font-weight:600;font-size:12px;color:var(--tx)}
.news{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);align-items:center}
.news:last-child{border:0}
.bb{display:flex;gap:14px;align-items:center;background:linear-gradient(90deg,#0a1f5c,#1c1f6a 60%,#8a1736);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--bd)}
.bbn{font-family:var(--dsp);font-weight:700;font-size:84px;line-height:.9;min-width:78px;text-align:center;color:#fff;text-shadow:0 4px 22px #000a}
.bb.w .bbn{color:var(--ac)}.bb.s .bbn{color:var(--ac2)}
.ai{border-left:4px solid var(--ac2)}
.drs{background:linear-gradient(180deg,#0a1646,#07102f)}
.drsrow{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--bd);font-weight:600}
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.verdict button{padding:14px;border-radius:10px;font-family:var(--dsp);font-size:26px;font-weight:700;border:1px solid var(--bd);background:var(--c2);color:#fff}
.verdict .out{background:var(--ac);border-color:var(--ac)}
.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac2);margin:0 3px;animation:pulse 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.timer{font-family:var(--dsp);font-size:24px;font-weight:700;background:var(--ac);padding:2px 14px;border-radius:6px}
.bidstrip{display:flex;align-items:center;justify-content:space-between;background:var(--grad);border-radius:10px;padding:8px 14px;font-weight:700}
.avpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.avpick button{background:var(--c2);border:2px solid var(--bd);border-radius:12px;padding:14px 4px;font-weight:700;color:#fff}
.avpick button.on{border-color:var(--ac)}
.avpick span{display:block;font-size:34px}
.stile{background:var(--c2);border-radius:10px;padding:10px;text-align:center}
.stile b{display:block;font-family:var(--dsp);font-size:28px}
/* drawer, sheet, bottom nav */
.scrim{position:fixed;inset:0;background:#000a;z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--bg);border-right:2px solid var(--ac);z-index:41;padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px;overflow:auto;animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(-100%)}}
.drawer .dh{padding:0 16px 12px;border-bottom:1px solid var(--bd);margin-bottom:6px}
.drawer button{display:block;width:100%;text-align:left;background:none;border:0;padding:13px 16px;font-weight:600;color:var(--tx)}
.drawer button.on{background:var(--c2);box-shadow:inset 3px 0 var(--ac)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:1000px;margin:0 auto;background:var(--card);border-top:2px solid var(--ac);border-radius:18px 18px 0 0;padding:14px 14px calc(88px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:1000px;display:grid;grid-template-columns:repeat(5,1fr);background:#07123aee;border-top:2px solid transparent;border-image:var(--grad) 1;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:42;backdrop-filter:blur(8px)}
.bnav button{background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600}
.bnav button.on{color:#fff}
.bnav button.on svg{stroke:var(--ac)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--grad);display:grid;place-items:center;margin:-28px auto 0;border:3px solid var(--bg);box-shadow:0 6px 18px #e11d2e66;color:#fff}
.fab svg{width:28px;height:28px}
/* welcome + auth */
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--grad);overflow:hidden;z-index:100;cursor:pointer;padding:20px;text-align:center}
.splash::before{content:"";position:absolute;inset:-20%;background:radial-gradient(60% 40% at 22% 30%,#3a5cff66,transparent 70%),radial-gradient(50% 40% at 82% 72%,#ff2b4a66,transparent 70%);animation:drift 7s ease-in-out infinite alternate}
.splash>*{position:relative}
.streaks span{position:absolute;height:2px;width:38vw;background:linear-gradient(90deg,transparent,#fffa,transparent);left:-45vw;animation:streak 2.6s ease-in infinite}
.slogo{position:relative;width:min(78vw,440px);aspect-ratio:var(--ar);animation:pop 1.2s cubic-bezier(.2,.8,.2,1) both}
.slogo img{width:100%;display:block;clip-path:inset(0 100% 0 0);animation:wipe 1.1s .3s cubic-bezier(.65,0,.2,1) forwards,glint 1.1s 1.6s ease-in-out;filter:drop-shadow(0 10px 30px #000a)}
.sname{font-family:var(--dsp);font-size:34px;font-weight:700;letter-spacing:10px;opacity:0;animation:tag 1s 1.9s forwards}
.stag{color:#ffffffcc;opacity:0;animation:tag 1s 2.3s forwards}
.loadbar{width:min(58vw,260px);height:4px;border-radius:9px;background:#ffffff33;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:#fff;animation:load 4s linear forwards}
.hint{font-size:12px;color:#ffffffaa;opacity:0;animation:tag 1s 2.8s forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes glint{50%{filter:drop-shadow(0 10px 30px #000a) brightness(1.55) saturate(1.2)}}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes streak{to{transform:translateX(170vw)}}
@keyframes drift{to{transform:translate(4%,3%) scale(1.08)}}
@keyframes tag{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes load{to{width:100%}}
.auth{padding:14px;max-width:440px;margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#0a1646;border-radius:12px;padding:4px;margin-bottom:6px}
.seg button{background:none;border:0;border-radius:9px;padding:10px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--grad);color:#fff}
.otp{font-size:28px;letter-spacing:10px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
/* OBS overlay */
.ovroot{container-type:size;position:relative;overflow:hidden;font-family:var(--dsp);color:#fff}
.ovpage .ovroot{position:fixed;inset:0}
.ovprev{aspect-ratio:16/9;width:100%;border-radius:10px;border:1px solid var(--bd);background:repeating-conic-gradient(#1a2a5a 0 25%,#0e1a42 0 50%) 0 0/24px 24px}
.ovprev.green{background:#00b140}.ovprev.black{background:#000}
.ov{--ob:linear-gradient(90deg,#0a1f5cf2,#2a1f66f2 60%,#9d1530f2);--oa:#ff3b50;--oc:#fff;--om:#b9c4ee}
.ovbug{position:absolute;left:3cqw;bottom:4cqw;width:46cqw}
.ovr1{display:flex;align-items:stretch;background:var(--ob);border-left:.6cqw solid var(--oa);border-radius:.6cqw;height:5.4cqw;overflow:hidden}
.ovr1>div{display:flex;align-items:center;padding:0 1.2cqw;gap:1cqw}
.ovtm{font-size:3cqw;font-weight:700}
.ovsc{background:var(--oa);color:var(--oc);font-size:3.6cqw;font-weight:700;margin-left:auto}
.ovov{font-size:2cqw;color:var(--om)}
.ovr2{background:var(--ob);margin-top:.3cqw;border-radius:.6cqw;padding:.7cqw 1.4cqw;display:flex;justify-content:space-between;font-size:2.1cqw;gap:1cqw}
.ovr2 b{color:#ffc83d}
.ovmsg{position:absolute;left:0;right:0;top:3cqw;margin:auto;width:70cqw;background:var(--ob);border-bottom:.5cqw solid var(--oa);color:#fff;font-size:3cqw;font-weight:700;text-align:center;padding:1cqw;border-radius:.8cqw}
.ovgfx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56cqw;background:var(--ob);border-top:.7cqw solid var(--oa);border-radius:.8cqw;padding:2cqw 2.4cqw;font-size:2.6cqw}
.ovgfx h4{margin:0 0 1cqw;font-size:3.6cqw;color:#ffc83d}
.ovgfx .l{display:flex;justify-content:space-between;padding:.5cqw 0;border-bottom:1px solid #fff2}
.ovspn{position:absolute;right:3cqw;bottom:4cqw;display:flex;gap:1cqw}
.ovspn img{height:5cqw;border-radius:.5cqw;background:#fff;padding:.4cqw}
.ovlogo{position:absolute;left:3cqw;top:3cqw;height:7cqw;filter:drop-shadow(0 .3cqw .8cqw #000a)}
@media print{.hdr,.bnav,.tabs,.noprint,#toast,.drawer,.scrim,.sheet{display:none!important}body{background:#fff;color:#000}.card{border-color:#999;background:#fff}:root{--tx:#000;--mu:#444;--bd:#bbb;--card:#fff;--bg:#fff;--c2:#eee}}

/* ---- mockup-style live header + pro scorer ---- */
.lm{background:linear-gradient(180deg,#0b1a45,#091338);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.lmh{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--dsp);font-size:22px}
.lmh .iconbtn{width:34px;height:34px;font-size:24px;line-height:1}
.lmscore{display:flex;align-items:center;justify-content:space-around;margin:8px 0 2px}
.lmstrip{display:grid;grid-template-columns:1fr 1fr;border-radius:8px;overflow:hidden;background:#0a1646;margin-top:10px}
.lmstrip>div{padding:10px;text-align:center;border-bottom:3px solid transparent}
.lmstrip>div.on{border-bottom-color:var(--ac)}
.runs{grid-template-columns:repeat(7,1fr)}
.fh{background:var(--ac2);color:#1b1500;font-weight:800;text-align:center;padding:7px;border-radius:8px;margin-bottom:8px;letter-spacing:1.5px}
.xrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}

.pcard{text-align:center}
.pphoto{width:132px;height:132px;border-radius:50%;margin:0 auto 10px;overflow:hidden;background:#12266a;border:3px solid var(--ac);display:grid;place-items:center;font-size:56px}
.pphoto img{width:100%;height:100%;object-fit:cover}
.pphoto svg{width:100%;height:100%}
.avatar svg{width:100%;height:100%;display:block}

/* ---- stories + reels + world matches ---- */
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.story{flex:none;width:70px;text-align:center;background:none;border:0;color:var(--tx);font-size:11px;font-weight:600}
.ring{width:64px;height:64px;border-radius:50%;padding:3px;background:conic-gradient(#ff3b50,#ffc83d,#3f7bff,#ff3b50);display:grid;place-items:center;margin:0 auto 4px}
.ring>div{width:100%;height:100%;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:26px;border:2px solid var(--bg);overflow:hidden}
.reels{height:calc(100dvh - 170px);min-height:440px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:16px;scrollbar-width:none}
.reel{height:100%;min-height:440px;scroll-snap-align:start;position:relative;padding:54px 70px 44px 18px;display:flex;flex-direction:column;justify-content:center;gap:8px;overflow:hidden;border-radius:16px;margin-bottom:8px}
.reel.c0{background:linear-gradient(160deg,#0a1f5c,#1a2a7a 50%,#8a1736)}
.reel.c1{background:linear-gradient(160deg,#07123a,#0f3fbf)}
.reel.c2{background:linear-gradient(160deg,#3a0a18,#e11d2e 70%,#0a1f5c)}
.reel.c3{background:linear-gradient(160deg,#0a1f5c,#12266a 45%,#b07d00)}
.reeltag{position:absolute;top:14px;left:14px;display:flex;gap:6px}
.reelact{position:absolute;right:10px;bottom:64px;display:flex;flex-direction:column;gap:14px;align-items:center}
.reelact button{background:#ffffff26;border:0;border-radius:50%;width:46px;height:46px;color:#fff;font-size:20px;display:grid;place-items:center;line-height:1}

<body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
/* =========================================================
   CricArena  |  single-file cricket scoring platform
   Sections: 1 State  2 Seed  3 Engine  4 Views  5 Actions  6 Overlay  7 Boot
   ========================================================= */
const LS='scoringheroes.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0);
let S=load();
const UI={stage:'welcome',view:'home',tab:'live',mid:null,sid:null,gi:2,ex:'',ang:null,modal:null,draft:null,q:'',cim:null,login:{step:1},rmid:null,ci:0};
function load(){try{const j=localStorage.getItem(LS);if(j)return JSON.parse(j)}catch(e){}return seed()}
let syncT=null;
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  clearTimeout(syncT);syncT=setTimeout(syncPush,400)}
/* Optional backend hook: paste a Firebase Realtime-DB JSON URL (https://xxx.firebaseio.com/cric.json) in Settings.
   Scorer device PUTs state, OBS overlay device GETs it. Works when you host this file yourself. */
function syncPush(){const u=S.settings.syncUrl;if(!u||location.hash==='#overlay')return;try{fetch(u,{method:'PUT',body:JSON.stringify(S)}).catch(()=>{})}catch(e){}}
function syncPull(){const u=S.settings.syncUrl;if(!u)return;try{fetch(u).then(r=>r.json()).then(j=>{if(j&&j.matches){S=j;render()}}).catch(()=>{})}catch(e){}}

/* ---------------- 2 SEED ---------------- */
function seed(){
  const mk=(n,r,tm,i)=>({id:uid(),name:n,role:r,team:tm,phone:'',bat:'Right-hand',bowl:r==='BOWL'||r==='AR'?'Right-arm fast':'',jersey:i+1,photo:null});
  const SA=['Aiden Markram','Ryan Rickelton','Wiaan Mulder','Temba Bavuma','Tristan Stubbs','David Bedingham','Kyle Verreynne','Marco Jansen','Keshav Maharaj','Kagiso Rabada','Lungi Ngidi','Dewald Brevis','Corbin Bosch'];
  const sr=['BAT','BAT','AR','BAT','BAT','BAT','WK','AR','BOWL','BOWL','BOWL','BAT','AR'];
  const AU=['Usman Khawaja','Travis Head','Marnus Labuschagne','Steve Smith','Cameron Green','Alex Carey','Mitchell Marsh','Pat Cummins','Mitchell Starc','Nathan Lyon','Josh Hazlewood','Josh Inglis','Scott Boland'];
  const ar=['BAT','BAT','BAT','BAT','AR','WK','AR','BOWL','BOWL','BOWL','BOWL','WK','BOWL'];
  const ta={id:uid(),name:'South Africa',short:'SA',color:'#0a7c4a',preset:2,logo:null,players:[]};
  const tb={id:uid(),name:'Australia',short:'AUS',color:'#c9a400',preset:0,logo:null,players:[]};
  const players=[];
  SA.forEach((n,i)=>{const p=mk(n,sr[i],ta.id,i);players.push(p);ta.players.push(p.id)});
  AU.forEach((n,i)=>{const p=mk(n,ar[i],tb.id,i);players.push(p);tb.players.push(p.id)});
  ['Aarav Mehta','Kabir Rao','Rohan Iyer','Vihaan Reddy','Arjun Nair','Dev Kapoor','Ishaan Verma','Sai Teja','Karthik Goud','Nikhil Varma','Harsha Vardhan','Pranav Chary'].forEach((n,i)=>players.push(mk(n,['BAT','BOWL','AR','WK'][i%4],null,i)));
  return {v:1,user:null,theme:(typeof matchMedia!=='undefined'&&matchMedia('(prefers-color-scheme: light)').matches)?'cbl':'cb',
    settings:{appName:'Scoring Heroes',appLogo:null,defLogo:0,sponsors:[],syncUrl:''},
    teams:[ta,tb],players,matches:[],messages:[],
    users:[],academy:{students:[]},grounds:[{id:uid(),name:'Main Oval',rate:2500},{id:uid(),name:'Practice Nets',rate:800},{id:uid(),name:'Turf Box',rate:1500}],bookings:[],
    auction:null,dream:{mid:null,picks:[],c:null,vc:null},
    stream:{mid:'',bg:'transparent',theme:'cb',sponsor:true,gfx:'',auto:8}}}

/* ---------------- 3 ENGINE ---------------- */
const fmtOv=l=>Math.floor(l/6)+'.'+l%6;
const P=id=>S.players.find(p=>p.id===id);
const T=id=>S.teams.find(t=>t.id===id);
const nm=id=>(P(id)||{}).name||'-';
const sh=id=>{const n=nm(id).split(' ');return n.length>1?n[0][0]+'. '+n.slice(1).join(' '):n[0]};
const mx=m=>m.overs*6;
const maxWk=(m,i)=>Math.min(10,((m.xi[m.innings[i].bat]||[]).length)-1);
const can=()=>S.user&&(S.user.role==='admin'||S.user.role==='scorer');
const isAdmin=()=>S.user&&S.user.role==='admin';
function howOut(e){const b=nm(e.bl),f=e.fld||'fielder';
  return ({Bowled:'b '+b,Caught:'c '+f+' b '+b,LBW:'lbw b '+b,Stumped:'st '+f+' b '+b,'Run out':'run out ('+f+')','Hit wicket':'hit wkt b '+b}[e.w])||e.w}
function calc(m,i){
  const inn=m.innings[i];
  const o={runs:0,wk:0,lg:0,ex:{wd:0,nb:0,b:0,lb:0},bat:{},bowl:{},fow:[],pov:[],cum:[],part:{r:0,b:0},ord:[]};
  if(!inn)return o;
  const gb=id=>o.bat[id]||(o.bat[id]={r:0,b:0,f4:0,f6:0,out:'',outw:''});
  const gw=id=>o.bowl[id]||(o.bowl[id]={b:0,r:0,w:0,m:0,wd:0,nb:0});
  inn.ev.forEach(e=>{
    const pen=e.x==='wd'||e.x==='nb'?1:0,tot=e.r+pen,legal=!pen,ov=Math.floor(o.lg/6);
    o.runs+=tot;if(e.x)o.ex[e.x]+=pen?tot:e.r;
    const B=gb(e.bt),W=gw(e.bl);
    if(e.x===''||e.x==='nb'){B.r+=e.r;if(e.r===4)B.f4++;if(e.r===6)B.f6++}
    if(e.x!=='wd')B.b++;
    W.r+=(e.x==='b'||e.x==='lb')?0:tot;if(e.x==='wd')W.wd+=tot;if(e.x==='nb')W.nb++;
    if(legal){W.b++;o.lg++}
    const q=o.pov[ov]||(o.pov[ov]={runs:0,wk:0,bl:e.bl,bc:0,lg:0});
    q.runs+=tot;q.bc+=(e.x==='b'||e.x==='lb')?0:tot;if(legal)q.lg++;
    o.part.r+=tot;if(e.x!=='wd')o.part.b++;
    if(e.w){o.wk++;q.wk++;
      if(e.w!=='Run out')W.w++;
      const O=gb(e.out);O.out=howOut(e);O.outw=e.w;
      o.fow.push({r:o.runs,w:o.wk,id:e.out,ov:fmtOv(o.lg)});o.part={r:0,b:0}}
    o.cum.push(o.runs)});
  o.pov.forEach(q=>{if(q&&q.lg===6&&q.bc===0)gw(q.bl).m++});
  (inn.used||[]).forEach(id=>gb(id));o.ord=inn.used||[];
  return o}
function newMatch(d){
  const m={id:uid(),a:d.a,b:d.b,overs:+d.overs||20,venue:d.venue||'',date:d.date||new Date().toISOString().slice(0,10),
    toss:d.toss,dec:d.dec,xi:{[d.a]:d.xiA,[d.b]:d.xiB},innings:[],cur:0,status:'setup',result:'',win:null,target:0,
    firstBat:(d.dec==='bat')?d.toss:(d.toss===d.a?d.b:d.a),umpires:d.umpires||'',scorer:S.user?S.user.name:''};
  S.matches.push(m);return m}
function startInnings(m,i,s,n,bl){
  const bat=i===0?m.firstBat:(m.firstBat===m.a?m.b:m.a),bowl=bat===m.a?m.b:m.a;
  m.innings[i]={bat,bowl,ev:[],cur:{s,n,bl},used:[s,n],lg:0,done:false};
  m.cur=i;m.status='live';if(i===1)m.target=calc(m,0).runs+1}
function ball(m,s){
  const inn=m.innings[m.cur],c=inn.cur;
  const e={r:s.r||0,x:s.x||'',w:s.w||'',out:null,fld:s.fld||'',bt:c.s,bl:c.bl,ang:s.ang||null,pre:{s:c.s,n:c.n,bl:c.bl,used:inn.used.slice()}};
  const legal=e.x!=='wd'&&e.x!=='nb';
  if(e.w){e.out=s.out||c.s;if(c.s===e.out)c.s=null;else if(c.n===e.out)c.n=null}
  inn.ev.push(e);if(legal)inn.lg++;
  if(e.r%2===1)[c.s,c.n]=[c.n,c.s];
  if(legal&&inn.lg%6===0){[c.s,c.n]=[c.n,c.s];c.bl=null}
  checkEnd(m)}
function checkEnd(m){
  const i=m.cur,inn=m.innings[i],k=calc(m,i);let end=false;
  if(k.wk>=maxWk(m,i)||inn.lg>=mx(m))end=true;
  if(i===1&&k.runs>=m.target)end=true;
  if(!end)return;
  inn.done=true;
  if(i===0){m.status='break';return}
  m.status='done';
  const A=T(inn.bat),Bt=T(inn.bowl),w=maxWk(m,1)-k.wk;
  if(k.runs>=m.target){m.result=`${A.name} won by ${w} wicket${w===1?'':'s'}`;m.win=A.id}
  else if(k.runs===m.target-1){m.result='Match tied';m.win=null}
  else{m.result=`${Bt.name} won by ${m.target-1-k.runs} runs`;m.win=Bt.id}}
function undo(m){
  const inn=m.innings[m.cur];if(!inn||!inn.ev.length)return false;
  const e=inn.ev.pop();if(e.x!=='wd'&&e.x!=='nb')inn.lg--;
  Object.assign(inn.cur,{s:e.pre.s,n:e.pre.n,bl:e.pre.bl});inn.used=e.pre.used;
  inn.done=false;m.status='live';m.result='';m.win=null;return true}
let avail=m=>{const inn=m.innings[m.cur];return(m.xi[inn.bat]||[]).filter(id=>!inn.used.includes(id))};
function lastOverBowler(m){const k=calc(m,m.cur);const inn=m.innings[m.cur];if(inn.lg%6!==0||!inn.lg)return null;const q=k.pov[inn.lg/6-1];return q?q.bl:null}
function bowlOpts(m){
  const inn=m.innings[m.cur],k=calc(m,m.cur),quota=Math.ceil(m.overs/5),lb=lastOverBowler(m);
  let l=(m.xi[inn.bowl]||[]).filter(id=>id!==lb&&((k.bowl[id]?k.bowl[id].b:0)/6)<quota);
  const real=l.filter(id=>['BOWL','AR'].includes((P(id)||{}).role));
  return real.length?real:l}
function fill(m){
  const inn=m.innings[m.cur],c=inn.cur;
  [['s'],['n']].forEach(([k])=>{if(c[k]===null){const a=avail(m);if(a.length){c[k]=a[0];inn.used.push(a[0])}}});
  if(c.bl===null){const o=bowlOpts(m);c.bl=o[Math.floor(Math.random()*o.length)]||(m.xi[inn.bowl]||[])[0]}}
function autoPlay(m,limit){
  let n=0;
  while(m.status==='live'&&n<limit){
    fill(m);const r=Math.random(),inn=m.innings[m.cur];let s;
    const fl=(m.xi[inn.bowl]||[])[Math.floor(Math.random()*11)];
    if(r<.04)s={x:'wd'};else if(r<.055)s={x:'nb'};else if(r<.08)s={w:'Bowled'};
    else if(r<.105)s={w:'Caught',fld:nm(fl)};else if(r<.11)s={w:'LBW'};
    else{const q=Math.random();s={r:q<.36?0:q<.64?1:q<.74?2:q<.77?3:q<.89?4:q<.93?6:1}}
    if(s.r>0&&!s.x)s.ang={a:Math.random()*Math.PI*2,d:s.r>=4?1.02:.3+Math.random()*.5};
    ball(m,s);n++}}
function demoMatch(){
  const [a,b]=S.teams;
  const m=newMatch({a:a.id,b:b.id,overs:20,venue:'Newlands, Cape Town',toss:b.id,dec:'bat',xiA:a.players.slice(0,11),xiB:b.players.slice(0,11),umpires:'Demo umpires'});
  const f=m.firstBat,sx=f===a.id?m.xi[a.id]:m.xi[b.id],bx=f===a.id?m.xi[b.id]:m.xi[a.id];
  startInnings(m,0,sx[0],sx[1],bx.find(id=>['BOWL','AR'].includes(P(id).role)));
  autoPlay(m,400);
  if(m.status==='break'){const s2=m.xi[m.innings[0].bowl],b2=m.xi[m.innings[0].bat];
    startInnings(m,1,s2[0],s2[1],b2.find(id=>['BOWL','AR'].includes(P(id).role)));autoPlay(m,80)}
  S.stream.mid=m.id;UI.mid=m.id;UI.sid=m.id;return m}
const curM=()=>S.matches.find(x=>x.id===UI.mid)||S.matches[S.matches.length-1];
function st(m){
  const i=m.cur,inn=m.innings[i];if(!inn)return null;
  const k=calc(m,i),left=mx(m)-k.lg,crr=k.lg?k.runs*6/k.lg:0,need=i===1?m.target-k.runs:null;
  return{i,inn,k,left,crr,need,rrr:i===1&&left>0?Math.max(0,need)*6/left:null,bat:T(inn.bat),bowl:T(inn.bowl)}}
function wpK(m,i,k){
  const par=m.overs<=10?9:m.overs<=20?8.2:m.overs<=40?6.3:5.6,tot=mx(m),left=tot-k.lg,wl=maxWk(m,i)-k.wk;
  const crr=k.lg?k.runs*6/k.lg:par,w=Math.min(1,k.lg/(tot*.5));
  const rate=(crr*w+par*(1-w))*(.4+.06*Math.max(0,wl)),proj=k.runs+left/6*rate;
  if(i===0){const p=1/(1+Math.exp(-(proj-par*m.overs)/Math.max(8,m.overs*1.1)));return .5+(p-.5)*.6}
  if(k.runs>=m.target)return 1;if(left<=0||wl<=0)return 0;
  return 1/(1+Math.exp(-(proj-(m.target-.5))/Math.max(5,Math.sqrt(left)*1.3)))}
function winP(m){
  if(m.status==='done')return m.win?{a:m.win===m.a?100:0,b:m.win===m.b?100:0}:{a:50,b:50};
  const s=st(m);if(!s)return{a:50,b:50};
  const p=wpK(m,s.i,s.k),pa=s.inn.bat===m.a?p:1-p;
  return{a:Math.round(pa*100),b:100-Math.round(pa*100)}}
function wpSeries(m){
  const pts=[];
  m.innings.forEach((inn,i)=>{
    for(let n=0;n<=inn.ev.length;n++){
      const sl=inn.ev.slice(0,n),lg=sl.filter(e=>e.x!=='wd'&&e.x!=='nb').length;
      const last=sl[n-1];
      if(n!==inn.ev.length&&!(last&&lg%6===0&&last.x!=='wd'&&last.x!=='nb'))continue;
      const mm={...m,innings:m.innings.map((x,j)=>j===i?{...x,ev:sl}:x)};
      const k=calc(mm,i);let p=wpK(m,i,k);
      if(i===1&&k.runs>=m.target)p=1;
      pts.push(inn.bat===m.a?p:1-p)}});
  return pts}
function overList(m,i){
  const inn=m.innings[i];if(!inn)return[];let lg=0;const L=[];
  inn.ev.forEach(e=>{
    const ov=Math.floor(lg/6),q=L[ov]||(L[ov]={n:ov+1,b:[],t:0,bl:e.bl}),pen=e.x==='wd'||e.x==='nb'?1:0;
    q.t+=e.r+pen;
    let lab=e.w?'W':e.x==='wd'?(e.r?'Wd+'+e.r:'Wd'):e.x==='nb'?(e.r?'Nb+'+e.r:'Nb'):e.x==='b'?'B'+e.r:e.x==='lb'?'Lb'+e.r:String(e.r);
    if(e.w&&e.r)lab='W+'+e.r;
    q.b.push({lab,cls:e.w?'w':(!e.x&&e.r===4)?'f':(!e.x&&e.r===6)?'s':pen?'x':''});
    if(!pen)lg++});
  return L.filter(Boolean)}
function cText(e){
  const b=sh(e.bl),a=sh(e.bt),v=(arr)=>arr[(e.r+hash(e.bt)+(e.pre?e.pre.used.length:0))%arr.length];
  if(e.w){const t={Bowled:'BOWLED! Through the gate.',Caught:'CAUGHT! '+(e.fld?'Taken by '+e.fld+'.':'In the deep.'),LBW:'LBW! Plumb in front.',Stumped:'STUMPED! Beaten in flight.','Run out':'RUN OUT! '+(e.fld?'Direct hit from '+e.fld+'.':''),'Hit wicket':'HIT WICKET!'}[e.w]||e.w;
    return `${b} to ${a}, OUT. ${t} ${sh(e.out)} walks back.`}
  if(e.x==='wd')return `${b} to ${a}, WIDE${e.r?' +'+e.r:''}. Too far outside.`;
  if(e.x==='nb')return `${b} to ${a}, NO BALL${e.r?', '+e.r+' off the bat':''}. Overstepped.`;
  if(e.x==='b')return `${b} to ${a}, ${e.r} bye${e.r>1?'s':''}. Beats everyone.`;
  if(e.x==='lb')return `${b} to ${a}, ${e.r} leg bye${e.r>1?'s':''}. Off the pads.`;
  if(e.r===0)return `${b} to ${a}, no run. ${v(['Defended solidly.','Left alone outside off.','Beaten on the outside edge.'])}`;
  if(e.r===1)return `${b} to ${a}, 1 run. ${v(['Worked off the hips.','Nudged into the gap.','Pushed to mid-off.'])}`;
  if(e.r===2)return `${b} to ${a}, 2 runs. Placed into the gap and hard running.`;
  if(e.r===3)return `${b} to ${a}, 3 runs. Chased down just short of the rope.`;
  if(e.r===4)return `${b} to ${a}, FOUR! ${v(['Cracked through the covers.','Pulled away to the fence.','Driven on the up.','Glanced fine.'])}`;
  if(e.r===6)return `${b} to ${a}, SIX! ${v(['Launched over long-on.','Heaved over midwicket.','Straight back over the bowler.'])}`;
  return `${b} to ${a}, ${e.r} runs.`}
function commentary(m,i){
  const inn=m.innings[i];if(!inn)return[];const out=[];let lg=0,rr=0,wk=0;
  inn.ev.forEach((e,idx)=>{
    const legal=e.x!=='wd'&&e.x!=='nb',pen=legal?0:1;rr+=e.r+pen;if(e.w)wk++;
    const lab=Math.floor(lg/6)+'.'+((lg%6)+(legal?1:0));
    out.push({t:'b',ov:lab,txt:cText(e),r:e.w?'W':e.r+pen,cls:e.w?'w':e.r===4&&!e.x?'f':e.r===6&&!e.x?'s':''});
    if(legal)lg++;
    if(legal&&lg%6===0){const q=calc({...m,innings:m.innings.map((x,j)=>j===i?{...x,ev:inn.ev.slice(0,idx+1)}:x)},i);
      const ov=q.pov[lg/6-1];out.push({t:'o',txt:`End of over ${lg/6}: ${ov.runs} run${ov.runs===1?'':'s'}${ov.wk?', '+ov.wk+' wkt':''}. ${T(inn.bat).short} ${q.runs}/${q.wk}.`})}});
  return out.reverse()}
function keyMoments(m){
  const out=[];
  m.innings.forEach((inn,i)=>{const run={};let lg=0,tot=0;
    inn.ev.forEach(e=>{const pen=e.x==='wd'||e.x==='nb'?1:0;tot+=e.r+pen;if(!pen)lg++;
      if(e.x===''||e.x==='nb'){const b=run[e.bt]||0,n=b+e.r;run[e.bt]=n;
        if(b<50&&n>=50)out.push(`${fmtOv(lg)} ov: ${nm(e.bt)} reaches a fifty`);
        if(b<100&&n>=100)out.push(`${fmtOv(lg)} ov: ${nm(e.bt)} brings up a hundred`);
        if(e.r===6)out.push(`${fmtOv(lg)} ov: SIX by ${nm(e.bt)} off ${nm(e.bl)}`)}
      if(e.w)out.push(`${fmtOv(lg)} ov: WICKET - ${nm(e.out)} (${tot}/${calc({...m,innings:m.innings.map((x,j)=>j===i?{...x,ev:inn.ev.slice(0,inn.ev.indexOf(e)+1)}:x)},i).wk})`)})});
  return out.slice(-6).reverse()}
function career(){
  const C={};const g=id=>C[id]||(C[id]={m:new Set(),inn:0,r:0,b:0,f4:0,f6:0,no:0,hs:0,ob:0,or:0,w:0,bbw:0,bbr:999,f50:0,mdn:0});
  S.matches.forEach(m=>m.innings.forEach((inn,i)=>{
    const k=calc(m,i);
    Object.entries(k.bat).forEach(([id,b])=>{if(!inn.used.includes(id))return;const c=g(id);c.m.add(m.id);c.inn++;c.r+=b.r;c.b+=b.b;c.f4+=b.f4;c.f6+=b.f6;if(!b.out)c.no++;c.hs=Math.max(c.hs,b.r);if(b.r>=50)c.f50++});
    Object.entries(k.bowl).forEach(([id,w])=>{const c=g(id);c.m.add(m.id);c.ob+=w.b;c.or+=w.r;c.w+=w.w;c.mdn+=w.m;if(w.w>c.bbw||(w.w===c.bbw&&w.r<c.bbr)){c.bbw=w.w;c.bbr=w.r}})}));
  return C}
/* Dream XI */
const credit=p=>({BAT:9,BOWL:8.5,AR:9.5,WK:8.5}[p.role]||8.5)+((hash(p.id)%5)/2-1);
function dreamPts(m,pid){
  let pts=0;const p=P(pid);if(!p)return 0;
  m.innings.forEach((inn,i)=>{const k=calc(m,i);
    if(inn.used.includes(pid)||(m.xi[inn.bowl]||[]).includes(pid))pts+=0;
    const b=k.bat[pid];if(b&&inn.used.includes(pid)){pts+=b.r+b.f4+b.f6*2;if(b.r>=100)pts+=16;else if(b.r>=50)pts+=8;else if(b.r>=30)pts+=4;if(b.r===0&&b.out&&p.role!=='BOWL')pts-=2}
    const w=k.bowl[pid];if(w){pts+=w.w*25+w.m*12;if(w.w>=5)pts+=16;else if(w.w>=3)pts+=4;const lw=inn.ev.filter(e=>e.bl===pid&&(e.w==='Bowled'||e.w==='LBW')).length;pts+=lw*8}});
  if(m.xi[p.team]&&m.xi[p.team].includes(pid)&&m.innings.length)pts+=4;
  return pts}
function dreamTotal(m,picks,c,vc){return picks.reduce((s,id)=>s+dreamPts(m,id)*(id===c?2:id===vc?1.5:1),0)}
function botTeams(m){
  const pool=[...(m.xi[m.a]||[]),...(m.xi[m.b]||[])];
  return['Kangaroo11','ProteaPower','SpinKing','CricGuru','BoundaryBoss'].map((n,bi)=>{
    const sorted=pool.slice().sort((x,y)=>((hash(x)*(bi+3))%17)-((hash(y)*(bi+3))%17));
    const picks=[];let cr=0;sorted.forEach(id=>{const c=credit(P(id));if(picks.length<11&&cr+c<=100){picks.push(id);cr+=c}});
    return{n,pts:dreamTotal(m,picks,picks[0],picks[1])}})}

const CX=(W,xm,v)=>34+(W-42)*v/xm,CY=(H,ym,v)=>H-34-(H-51)*v/ym;
function axes(W,H,xm,ym){
  let s='';for(let i=0;i<=4;i++){const y=H-34-(H-51)*i/4;s+=`<line x1="34" x2="${W-8}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="28" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mu)">${Math.round(ym*i/4)}</text>`}

function overCum(m,i){
  const k=calc(m,i);let run=0;const pts=[[0,0]],wk=[];
  k.pov.forEach((q,idx)=>{if(!q)return;run+=q.runs;const x=idx+q.lg/6;pts.push([x,run]);if(q.wk)wk.push([x,run])});return{pts,wk}}
function wormSVG(m){
  const W=640,H=260,series=m.innings.map((_,i)=>overCum(m,i)),ym=Math.max(20,...series.flatMap(s=>s.pts.map(p=>p[1])))*1.1,cols=['var(--ac)','var(--ac2)'];
  let s=axes(W,H,m.overs,ym);
  series.forEach((sr,i)=>{s+=`<polyline fill="none" stroke="${cols[i]}" stroke-width="2.5" points="${sr.pts.map(p=>CX(W,m.overs,p[0])+','+CY(H,ym,p[1])).join(' ')}"/>`+sr.wk.map(p=>`<circle cx="${CX(W,m.overs,p[0])}" cy="${CY(H,ym,p[1])}" r="4.5" fill="var(--rd)"/>`).join('')});
  s+=m.innings.map((inn,i)=>`<text x="${44+i*110}" y="14" font-size="11" fill="${cols[i]}" font-weight="700">${esc(T(inn.bat).short)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${s}</svg>`}
function manhSVG(m,i){
  const W=640,H=240,k=calc(m,i),ym=Math.max(10,...k.pov.filter(Boolean).map(q=>q.runs))*1.15,bw=(W-42)/m.overs;let s=axes(W,H,m.overs,ym);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${s}</svg>`}
function wagonSVG(m,i){

  inn.ev.forEach(e=>{if(!e.ang||!e.r||e.x==='b'||e.x==='lb')return;const d=Math.min(1.05,e.ang.d)*R,x=120+Math.cos(e.ang.a)*d,y=120+Math.sin(e.ang.a)*d;
    const col=e.r===6?'var(--rd)':e.r===4?'var(--ac)':e.r>=2?'var(--ac2)':'var(--mu)';s+=`<line x1="120" y1="120" x2="${x}" y2="${y}" stroke="${col}" stroke-width="${e.r>=4?1.8:1}" opacity=".85"/>`});

function vScore(){
  if(!can())return'<div class="empty">Only Admin or Scorer accounts can score matches. Change your role in Settings (demo) or ask the organiser.</div>';

  if(!m)return `<div class="empty">No match to score yet.<br><br><button class="btn" data-a="newMatch">+ New match</button></div>`;
  const pick=S.matches.length>1?`<select data-c="sid">${opt(S.matches.map(x=>[x.id,T(x.a).short+' vs '+T(x.b).short+' ('+x.status+')']),m.id)}</select>`:'';

function render(){
  document.documentElement.dataset.theme='sh';
  const R=document.getElementById('app');
  if(location.hash==='#overlay'){document.body.classList.add('ovpage');R.innerHTML=overlayHTML();R.style.maxWidth='none';R.style.padding='0';return}
  document.body.classList.remove('ovpage');R.style.maxWidth='';R.style.padding='';
  if(UI.stage==='welcome'){R.innerHTML=vSplash();return}
  if(!S.user){R.innerHTML=hdrSimple()+vAuth();renderModal();return}
  const V={home:vHome,matches:vMatches,match:vMatch,score:vScore,players:vPlayers,teams:vTeams,auction:vAuction,dream:vDream,academy:vAcademy,reels:vReels,profile:vProfile,book:vBook,stream:vStream,reports:vReports,settings:vSettings}[UI.view]||vHome;
  R.innerHTML=hdr()+`<main>${V()}</main>`+bnav()+drawer()+sheet();
  renderModal()}
function hdrSimple(){return `<header class="hdr"><a class="hlogo"><img src="${logoSrc()}" alt="Sports Sky High logo"></a></header>`}
function hdr(){
  const u=S.user;
  return `<header class="hdr"><a class="hlogo" data-a="go" data-v="home" role="button" aria-label="Scoring Heroes home"><img src="${logoSrc()}" alt="Sports Sky High logo"></a><div class="grow"></div>
  <button class="iconbtn" data-a="notif" aria-label="Notifications">${ic('bell')}${S.messages.length?'<i class="dot"></i>':''}</button>
  <button class="iconbtn me" data-a="go" data-v="profile" aria-label="Profile">${esc((u.nick||u.name||'?')[0].toUpperCase())}</button>
  <button class="iconbtn" data-a="menu" aria-label="Menu">${ic('menu')}</button></header>`}
function drawer(){
  if(!UI.drawer)return'';
  return `<div class="scrim" data-a="menu"></div><aside class="drawer"><div class="dh"><img src="${logoSrc()}" alt="" style="height:42px"><div class="mu sm" style="margin-top:6px">${esc(S.user.nick||S.user.name)} (${esc(S.user.kind||S.user.role)})</div></div>${MENU.map(([k,l])=>`<button class="${UI.view===k?'on':''}" data-a="go" data-v="${k}">${l}</button>`).join('')}<button data-a="logout">Sign out</button></aside>`}
function sheet(){
  if(!UI.sheet)return'';
  return `<div class="scrim" data-a="plus"></div><div class="sheet"><h3 style="margin-bottom:10px">Quick actions</h3><div class="qgrid">${[['score','Score a match'],['newMatch','New match'],['player','Register player'],['live','Go live'],['book','Book ground'],['team','Create team'],['auction','Auction'],['demo','Demo match']].map(([k,l])=>`<button data-a="qa" data-v="${k}">${l}</button>`).join('')}</div></div>`}
function bnav(){
  const t=[['home','Home','home'],['matches','Matches','matches'],null,['academy','Academy','academy'],['profile','Profile','profile']];
  return `<nav class="bnav">${t.map(x=>x?`<button class="${UI.view===x[0]?'on':''}" data-a="go" data-v="${x[0]}">${ic(x[2])}${x[1]}</button>`:`<button data-a="plus" aria-label="Quick actions"><span class="fab">${ic('plus')}</span></button>`).join('')}</nav>`}
/* welcome */

  return `<div class="splash" data-a="start" role="button" aria-label="Continue"><div class="streaks"><span style="top:20%"></span><span style="top:38%;animation-delay:.7s"></span><span style="top:62%;animation-delay:1.3s"></span><span style="top:80%;animation-delay:.3s"></span></div>

  (tab==='login'?`<form data-f="login"><label>Mobile number<input name="phone" inputmode="tel" required pattern="[0-9+ ]{10,15}" placeholder="+91 98765 43210" value="${esc(L.phone||'')}"></label><button class="btn wide">Send OTP</button></form>`
  :`<form data-f="register"><label>Nickname (public)<input name="nick" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_.]+" title="Letters, numbers, dot and underscore" placeholder="Rohit_45"></label>
  <label>Mobile number (private)<input name="phone" inputmode="tel" required pattern="[0-9+ ]{10,15}" placeholder="+91 98765 43210" value="${esc(L.phone||'')}"></label>
  <label>Email (private)<input type="email" name="email" required placeholder="name@email.com"></label>

  if(!apiBase()){const code=String(100000+Math.floor(Math.random()*900000));UI.login=Object.assign({step:2,code},o);render();toast('Demo OTP: '+code,9000);return}
  UI.login=Object.assign({step:2,real:true,sending:true},o);render();
  try{const j=await post('/otp/send',{phone:digits(o.phone)});if(!j.ok)throw new Error(j.error||'SMS failed');
    UI.login.sending=false;render();webOtp();if(j.devOtp)toast('Dev OTP: '+j.devOtp,9000)}
  catch(e){UI.login={step:1,phone:o.phone};render();toast(e.message==='Failed to fetch'?'Cannot reach the OTP server':e.message,4200)}}
function webOtp(){
  if(!('OTPCredential' in window))return;
  if(UI.otpAbort)UI.otpAbort.abort();const ac=new AbortController();UI.otpAbort=ac;
  navigator.credentials.get({otp:{transport:['sms']},signal:ac.signal}).then(c=>{if(c&&c.code)verifyReal(c.code)}).catch(()=>{})}
async function verifyReal(code){
  const L=UI.login;if(!L||!L.real||L.busy)return;L.busy=true;
  try{const j=await post('/otp/verify',{phone:digits(L.phone),otp:String(code).trim()});L.busy=false;if(!j.ok)return toast(j.error||'Wrong code, try again',3500);L.session=j.token;finishLogin()}
  catch(e){L.busy=false;toast('Network problem, try again')}}
function finishLogin(){

async function magicLink(){
  const m=/^#v=([\w-]+)/.exec(location.hash);if(!m||!apiBase())return;
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  UI.stage='app';render();
  try{const j=await post('/otp/verify-link',{token:m[1]});if(!j.ok)return toast(j.error||'Link expired',4200);
    const u=S.users.find(x=>x.phone===digits(j.phone));
    if(u){UI.login={step:1,mode:'login',uid:u.id,phone:j.phone,session:j.token};finishLogin()}
    else{UI.verifiedPhone=digits(j.phone);UI.authTab='register';UI.login={step:1,phone:j.phone};render();toast('Number verified. Complete your profile.',4200)}}
  catch(e){toast('Could not verify the link. Check your internet.',4200)}}

function ballBanner(m){
  const s=st(m);if(!s)return'';const e=s.inn.ev[s.inn.ev.length-1];if(!e)return'';
  const big=e.w?'W':e.x==='wd'?'Wd':e.x==='nb'?'Nb':String(e.r),cls=e.w?'w':(!e.x&&e.r===6)?'s':'';
  return `<div class="bb ${cls}"><div class="bbn">${big}</div><div><div class="b" style="font-size:16px">${esc(cText(e))}</div><div class="mu sm" style="margin-top:6px">CRR ${s.crr.toFixed(2)} | Partnership ${s.k.part.r} (${s.k.part.b})</div></div></div>`}
function zoneName(e,p){
  const x=Math.cos(e.ang.a),y=Math.sin(e.ang.a);let th=Math.atan2(x,-y)*180/Math.PI;if(p&&p.bat==='Left-hand')th=-th;
  let k=Math.round(th/45);if(k<-3)k+=8;if(k>4)k-=8;
  return({0:'straight',1:'cover',2:'point',3:'third man',4:'the area behind the keeper','-3':'fine leg','-2':'square leg','-1':'midwicket'})[k]||'the ring'}
function insight(m,i){
  const inn=m.innings[i];if(!inn)return'';const by={};
  inn.ev.forEach(e=>{if(!e.ang||!e.r||e.x==='b'||e.x==='lb'||e.x==='wd')return;const z=zoneName(e,P(e.bt)),o=by[e.bt]||(by[e.bt]={tot:0,z:{}});o.tot+=e.r;o.z[z]=(o.z[z]||0)+e.r});
  const best=Object.entries(by).sort((a,b)=>b[1].tot-a[1].tot)[0];
  if(!best||best[1].tot<8)return'Not enough shot-direction data yet. Tap the field in the Scorer to record where each shot goes.';
  const [z,v]=Object.entries(best[1].z).sort((a,b)=>b[1]-a[1])[0];
  return `${nm(best[0])} has scored ${Math.round(v*100/best[1].tot)}% of their recorded runs through ${z}.`}
function tComm(m){

  return `<div class="card"><h3>AI commentary</h3><div class="b" style="margin:8px 0">Win probability by over</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Win probability chart">${bars}</svg>

/* DRS review (workflow + simulated tracking) */
function drsData(m){
  const s=st(m);if(!s)return null;const ev=s.inn.ev;let idx=-1;
  for(let i=ev.length-1;i>=0;i--)if(ev[i].w==='LBW'){idx=i;break}
  if(idx<0)idx=ev.length-1;if(idx<0)return null;
  const e=ev[idx],r=((hash(m.id)+idx*37+s.i*11)*7919)%100;
  const pitch=r<72?'In-Line':r<86?'Outside Off':'Outside Leg',impact=((r*3)%100)<68?'In-Line':'Outside Off',wk=((r*5)%100)<62?'Hitting':'Missing';
  return{e,key:m.id+':'+s.i+':'+idx,pitch,impact,wk,out:pitch!=='Outside Leg'&&impact==='In-Line'&&wk==='Hitting'}}
function drsSVG(d){
  const ox=v=>v==='Outside Off'?18:v==='Outside Leg'?-18:0,px=150+ox(d.pitch),ix=150+ox(d.impact),sx=150+(d.wk==='Hitting'?0:(d.pitch==='Outside Leg'?-34:34));
  return `<svg viewBox="0 0 300 230" class="chart" role="img" aria-label="Ball tracking"><polygon points="96,224 204,224 168,16 132,16" fill="#6b5a2e" opacity=".55"/><line x1="150" y1="224" x2="150" y2="16" stroke="#fff3" stroke-dasharray="4 6"/>
  <g stroke="#fff" stroke-width="3"><line x1="143" y1="10" x2="143" y2="26"/><line x1="150" y1="10" x2="150" y2="26"/><line x1="157" y1="10" x2="157" y2="26"/></g>
  <polyline fill="none" stroke="#ff3b50" stroke-width="3" points="150,222 ${px},140 ${ix},72 ${sx},24"/><circle cx="${px}" cy="140" r="6" fill="#fff"/><circle cx="${ix}" cy="72" r="7" fill="#ff3b50" stroke="#fff"/><circle cx="${sx}" cy="24" r="6" fill="#ffc83d"/></svg>`}
function tDRS(m){

  return `<div class="card drs"><h3>DRS review</h3><div class="mu sm" style="margin:4px 0 8px">${esc(sh(d.e.bl))} to ${esc(sh(d.e.bt))}</div>${body}</div><div class="mu sm">Simulation for the workflow and screens. Real ball tracking needs multi-camera hardware or an AI vision model plugged in here.</div>`}
