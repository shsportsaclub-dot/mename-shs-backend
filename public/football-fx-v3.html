<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scoring Heroes Football FX v3</title>
<style>:root{color-scheme:dark;font:15px system-ui;background:#080e1a;color:white}*{box-sizing:border-box}body{margin:0}header{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:#111c30}header b{letter-spacing:2px}main{max-width:1200px;margin:auto;padding:12px}.stage{width:100%;aspect-ratio:16/9;max-height:80vh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 5%,#416d99 0%,#172d4e 40%,#081423 75%);border:1px solid #607b9b;border-radius:12px}.stands{position:absolute;top:15%;height:35%;width:100%;background:repeating-linear-gradient(0deg,transparent 0 11px,#ffffff13 12px 14px),repeating-linear-gradient(90deg,#31425c 0 8px,#19273c 8px 15px)}.pitch{position:absolute;inset:47% 0 0;background:repeating-linear-gradient(90deg,#18644b 0 12.5%,#237556 12.5% 25%)}.pitch:after{content:"";position:absolute;inset:8% 14% 0;border:2px solid #ffffff70;border-radius:5px;transform:perspective(420px) rotateX(24deg)}.bug{position:absolute;z-index:8;top:5%;left:4%;display:flex;align-items:center;filter:drop-shadow(0 6px 8px #0008);font-weight:900}.bug .home,.bug .away{padding:9px 14px;background:#16579b;border-bottom:4px solid #38d3ff}.bug .away{background:#9c2f3d;border-color:#ffbc58}.bug .n{padding:6px 14px;background:white;color:#061325;font-size:24px}.bug .clock{padding:10px;background:#1ae1b3;color:#062622;font-size:12px}.scene{position:absolute;z-index:5;inset:12% 6% 7%;display:flex;align-items:center;justify-content:center;pointer-events:none}.hero{text-align:center;position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;animation:rise .45s both}.title{font-size:clamp(30px,7vw,100px);font-weight:1000;line-height:1;text-shadow:0 6px 15px #000c;letter-spacing:.07em}.subtitle{font-weight:800;letter-spacing:3px;font-size:clamp(9px,1.5vw,18px);margin-top:12px}.net{width:28%;height:33%;border:6px solid white;background:repeating-linear-gradient(90deg,#ffffff88 0 2px,transparent 2px 18px),repeating-linear-gradient(0deg,#ffffff88 0 2px,transparent 2px 18px);position:absolute;top:17%;left:42%;animation:net 1.8s both}.ball{position:absolute;left:15%;top:70%;width:clamp(24px,5vw,55px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 28% 25%,white 0 28%,#b9c9d4 72%,#54616b);display:grid;place-items:center;font-size:clamp(20px,4vw,40px);animation:fly 1.8s cubic-bezier(.2,.7,.4,1) forwards;filter:drop-shadow(0 4px 8px #0008)}.goalword{position:absolute;top:51%;animation:goal 2s both;color:#fff;text-shadow:0 0 18px #36d9ff,0 0 45px #06d9d1}.flash{position:absolute;inset:0;background:#fff;animation:flash 1.4s both}.rays{position:absolute;width:35%;aspect-ratio:1;background:conic-gradient(transparent 0 16deg,var(--tone) 17deg 23deg,transparent 24deg 45deg);animation:spin 5s linear infinite;opacity:.55}.card{height:45%;aspect-ratio:3/4;border-radius:12px;background:linear-gradient(125deg,#ffffff77,var(--tone) 25% 80%,#0005);border:3px solid #ffffff8c;box-shadow:0 0 65px var(--tone);animation:card .8s both}.subgrid{display:flex;gap:clamp(10px,4vw,65px);align-items:center}.jersey{width:clamp(65px,11vw,130px);height:clamp(75px,13vw,150px);clip-path:polygon(25% 0,40% 9%,60% 9%,75% 0,100% 18%,85% 42%,78% 37%,78% 100%,22% 100%,22% 37%,15% 42%,0 18%);background:var(--tone);display:grid;place-items:center;font-size:clamp(26px,6vw,55px);font-weight:1000}.in{animation:enter 1s both}.out{animation:leave 1s both}.lineup{width:90%;height:85%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:5px;align-items:center;justify-items:center}.player{background:#0c2a48e8;border:1px solid #5fcce2;border-radius:8px;padding:5px 9px;text-align:center;min-width:60px;font-size:clamp(9px,1.2vw,14px);font-weight:750;animation:rise .45s both}.player strong{display:block;font-size:clamp(15px,2vw,28px);color:#71e6e0}.stat{width:min(70%,520px);padding:18px;background:#10243ddf;border-left:5px solid #26dfc5}.statrow{margin:10px 0;text-align:left}.track{height:12px;background:#273f5c;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2e9ef5,#4ce8ae);animation:grow 1s both;transform-origin:left}.confetti{position:absolute;inset:0;overflow:hidden}.confetti i{position:absolute;top:-15%;left:var(--x);width:7px;height:14px;background:var(--c);animation:fall 2.5s var(--d) linear infinite}.controls{display:flex;flex-wrap:wrap;gap:8px;padding:15px 0}button{border:1px solid #657c96;background:#182e49;color:white;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:700}button[aria-pressed=true]{background:#127c73;border-color:#60f5d7}button:focus-visible{outline:3px solid #66f3d8}.note{font-size:12px;color:#b4c4d9}.lane{position:absolute;bottom:0;left:0;right:0;background:#08182cdb;padding:5px 16px;font-size:12px;z-index:7;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.safe{position:absolute;inset:5%;border:1px dashed #ffffff22;pointer-events:none}.stage,.scene,.hero{overflow:hidden!important;scrollbar-width:none}.stage::-webkit-scrollbar,.scene::-webkit-scrollbar{display:none}@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes fly{0%{left:15%;top:70%;transform:rotate(0) scale(1)}70%{left:53%;top:22%;transform:rotate(700deg) scale(.55)}100%{left:55%;top:31%;transform:rotate(900deg) scale(.35)}}@keyframes net{0%,72%{transform:scale(1)}83%{transform:scale(1.16)}100%{transform:scale(1)}}@keyframes goal{0%,65%{opacity:0;transform:scale(2)}85%{opacity:1;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}@keyframes flash{0%,72%,100%{opacity:0}78%{opacity:.35}}@keyframes card{from{opacity:0;transform:translateY(100%) rotate(-25deg) scale(.4)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes enter{from{opacity:0;transform:translateX(100px)}to{opacity:1;transform:none}}@keyframes leave{from{opacity:0;transform:translateX(-100px)}to{opacity:1;transform:none}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes fall{to{transform:translateY(65vh) rotate(650deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:550px){.bug .home,.bug .away{padding:5px}.bug .n{padding:4px 8px;font-size:16px}.bug .clock{padding:6px}.scene{inset:12% 3% 8%}.net{border-width:3px}.lane{font-size:9px}.player{min-width:44px;padding:2px}}</style>
<header><b>SCORING HEROES · FOOTBALL FX</b><span>NO-SCROLL BROADCAST · V3</span></header><main><div class="stage" id="stage"><div class="stands"></div><div class="pitch"></div><div class="safe"></div><div class="bug"><div class="home">HOME</div><div class="n" id="home">0</div><div class="clock">67:24<br>LIVE</div><div class="n" id="away">0</div><div class="away">AWAY</div></div><div class="scene" id="scene"></div><div class="lane" id="lane">SCORING HEROES · DEMO DATA · GRAPHICS ARE ILLUSTRATIONS</div></div><div class="controls" id="buttons"></div><div class="note" id="note">No real player or tracking data connected. Operator controls are outside the broadcast viewport.</div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let home=0,away=0,current='goal';const data=[['goal','⚽ GOAL'],['red','🟥 RED CARD'],['yellow','🟨 YELLOW CARD'],['sub','🔁 SUBSTITUTION'],['lineup','👥 PLAYING XI'],['records','📊 RECORDS'],['celebrate','🎉 CELEBRATION'],['var','◉ VAR'],['save','🧤 SAVE']];const title=(a,b)=>'<div class="title">'+a+'</div><div class="subtitle">'+b+'</div>';const confetti=()=>'<div class="confetti">'+Array.from({length:35},(_,i)=>'<i style="--x:'+(i*31%100)+'%;--d:'+(i%9*.11)+'s;--c:'+['#3be4df','#ffe073','#ff5b76','#ffffff'][i%4]+'"></i>').join('')+'</div>';function draw(k){current=k;let h='';switch(k){case'goal':h='<div class="hero"><div class="net"></div><div class="ball">⚽</div><div class="goalword">'+title('GOAL!','09 · ARUN · HOME')+'</div></div>'+confetti()+'<div class="flash"></div>';break;case'red':case'yellow':{let red=k==='red';h='<div class="hero" style="--tone:'+(red?'#f12745':'#ffcf21')+'"><div class="rays"></div><div class="card"></div>'+title(red?'RED CARD':'YELLOW CARD',red?'04 · SENT OFF':'07 · CAUTION')+'</div>';break}case'sub':h='<div class="hero">'+title('SUBSTITUTION','SCORER-ENTERED')+'<div class="subgrid"><div class="out"><div class="jersey" style="--tone:#d94153">11</div>↓ OUT · ARUN</div><div style="font-size:45px">⇄</div><div class="in"><div class="jersey" style="--tone:#1469b4">17</div>↑ IN · DEV</div></div></div>';break;case'lineup':{let positions=[{n:1,r:4,c:2,p:'GK'},{n:2,r:3,c:1,p:'DEF'},{n:3,r:3,c:2,p:'DEF'},{n:4,r:3,c:3,p:'DEF'},{n:5,r:3,c:4,p:'DEF'},{n:6,r:2,c:1,p:'MID'},{n:7,r:2,c:2,p:'MID'},{n:8,r:2,c:4,p:'MID'},{n:9,r:1,c:1,p:'FWD'},{n:10,r:1,c:2,p:'FWD'},{n:11,r:1,c:4,p:'FWD'}];h='<div class="hero"><div class="subtitle">STARTING XI · 4–3–3 · DEMO FORMATION</div><div class="lineup">'+positions.map((x,i)=>'<div class="player" style="grid-row:'+x.r+';grid-column:'+x.c+';animation-delay:'+(i*.06)+'s"><strong>'+x.n+'</strong>PLAYER '+x.n+'<br>'+x.p+'</div>').join('')+'</div></div>';break}case'records':h='<div class="hero"><div class="stat"><div class="subtitle">PLAYER 09 · ARUN · DEMO RECORDS</div>'+[['GOALS',16,80],['ASSISTS',8,40],['SHOTS ON TARGET',23,92]].map(x=>'<div class="statrow"><b>'+x[0]+' · '+x[1]+'</b><div class="track"><div class="fill" style="width:'+x[2]+'%"></div></div></div>').join('')+'</div></div>';break;case'celebrate':h=confetti()+'<div class="hero">'+title('WHAT A GOAL!','TEAM CELEBRATION · 09 ARUN')+'</div>';break;case'var':h='<div class="hero">'+title('VAR CHECK','AWAITING OFFICIAL DECISION')+'<div class="subtitle">NO VERDICT GENERATED</div></div>';break;case'save':h='<div class="hero"><div class="ball" style="animation-direction:reverse">⚽</div>'+title('SUPER SAVE','GOALKEEPER 01')+'</div>';break} $('scene').innerHTML=h;$('note').textContent='Showing '+k.toUpperCase()+' · illustrative animation · no sensors or match feed';document.querySelectorAll('[data-event]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.event===k)))}data.forEach(([k,label])=>{let b=document.createElement('button');b.textContent=label;b.dataset.event=k;b.onclick=()=>{if(k==='goal'){$('home').textContent=++home}draw(k)};$('buttons').append(b)});let replay=document.createElement('button');replay.textContent='↻ REPLAY';replay.onclick=()=>draw(current);$('buttons').append(replay);let reset=document.createElement('button');reset.textContent='RESET';reset.onclick=()=>{home=away=0;$('home').textContent=0;$('away').textContent=0;draw('goal')};$('buttons').append(reset);draw('goal')})();
</script></html>
