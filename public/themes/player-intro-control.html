<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Intro Quick Control</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06101f;color:#fff;font-family:Arial,sans-serif;padding:10px}
.pv{position:relative;width:100%;aspect-ratio:16/9;background:#0a1a33;border:1px solid #c99851;overflow:hidden}.pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{display:flex;gap:8px;margin:10px 0}.bar button{flex:1;padding:14px;font-weight:700;font-size:16px;border:1px solid #c99851;background:#102c58;color:#ffd77d;border-radius:8px}
.bar button.go{background:#dba84e;color:#06152b}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;padding:10px;background:#0b2144;color:#c5def9;border:1px solid #2a4a7a;border-radius:8px;font-weight:700}.tabs .on{background:#dba84e;color:#06152b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.p{padding:10px;border:1px solid #2a4a7a;background:#0b2144;border-radius:8px;text-align:left;color:#fff;font-size:14px}.p b{display:block;color:#ffd77d;font-size:18px}.p small{color:#9bc1df}
.p.sel{outline:2px solid #ffd77d;background:#17406f}
.hint{color:#9bc1df;font-size:12px;margin:6px 0}
</style></head><body>
<div class="pv"><iframe id="f" src="royal-shield-b.html?screen=pi"></iframe></div>
<div class="bar"><button class="go" id="show">SHOW</button><button id="hide">HIDE</button><button id="nx">NEXT ▶</button><button id="ly">STYLE 1</button></div>
<div class="tabs" id="tabs"></div><div class="hint" id="src"></div>
<div class="hint">Tap a player. Name, role, stats fill automatically — no typing.</div>
<div class="grid" id="g"></div>
<script>
const DEMO=[
[['Hemanth','All-rounder',90,377,9.43,'115*',[['MATCHES','90'],['RUNS','377'],['AVERAGE','9.43'],['HIGH SCORE','115*']]],['Aarav Sharma','Opening batter',86,2914,146.2,'112*'],['Rohan Mehta','Opening batter',74,2310,139.8,'98'],['Karan Verma','Top-order batter',69,2105,134.5,'104'],['Dev Patel','Middle-order batter',81,2488,151.0,'87*'],['Imran Khan','Wicket-keeper batter',64,1760,148.7,'91'],['Vihaan Rao','All-rounder',72,1522,143.3,'76'],['Arjun Nair','All-rounder',58,980,137.9,'64*'],['Sameer Joshi','Spinner',66,310,112.1,'28'],['Tarun Das','Fast bowler',71,205,101.4,'19*'],['Nikhil Roy','Fast bowler',60,140,96.2,'15'],['Yash Gupta','Spinner',54,98,90.0,'12*']],
[['Vikram Kumar','All-rounder · Captain',62,1804,145.2,'104*'],['Manav Singh','Opening batter',70,2210,141.6,'101'],['Kabir Anand','Opening batter',55,1650,136.4,'89'],['Rahul Dixit','Top-order batter',77,2390,138.9,'96*'],['Zaid Ali','Wicket-keeper batter',63,1710,150.3,'83'],['Harsh Tyagi','Middle-order batter',68,1480,147.5,'72'],['Pranav Jain','All-rounder',59,1105,140.8,'69'],['Ishaan Bose','Spinner',65,260,108.7,'24'],['Aditya Rana','Fast bowler',73,190,99.9,'21'],['Siddharth Pal','Fast bowler',57,120,94.0,'14*'],['Mohit Chauhan','Spinner',50,85,88.5,'10']]];

const RN={BAT:'Batter',BOWL:'Bowler',AR:'All-rounder',WK:'Wicket-keeper'};
function real(){try{const S=JSON.parse(localStorage.getItem('scoringheroes.v1')||'null');if(!S||!S.players||!S.players.length)return null;
 const tn={};(S.teams||[]).forEach(x=>tn[x.id]=x.name);const g={};
 S.players.filter(p=>p.name&&!p.demo).forEach(p=>{const e=p.earlier||{},b=e.bat||{},w=e.bowl||{};const st=[];
  if(b.mat)st.push(['MATCHES',''+b.mat]);if(b.runs!==undefined)st.push(['RUNS',''+b.runs]);if(w.wkts!==undefined)st.push(['WICKETS',''+w.wkts]);if(b.hs)st.push(['HIGH SCORE',''+b.hs]);
  const key=p.team?(tn[p.team]||'Team'):'Players';(g[key]=g[key]||[]).push([p.name,(RN[p.role]||p.role||'Player')+(p.jersey?' · #'+p.jersey:''),0,0,0,0,st.length?st:[['ROLE',(RN[p.role]||'PLAYER').toUpperCase()]],p.photo||p.avatar||'',key])});
 const k=Object.keys(g);return k.length?k.map(n=>({n,p:g[n]})):null}catch(e){return null}}
const RL=real();const TEAMS=RL||[{n:'SKY HIGH KINGS',p:DEMO[0]},{n:'HAPUR HAWKS',p:DEMO[1]}];
const R=TEAMS.map(x=>x.p);
const TEAM=TEAMS.map(x=>x.n);let team=0,cur=0;const f=document.getElementById('f'),g=document.getElementById('g');
const send=(fn,...a)=>f.contentWindow.postMessage({shTheme:1,fn,args:a},'*');
const pack=(p,t,img)=>({pi:{n:p[0],tm:TEAM[t],rl:p[1].toUpperCase(),img:img||'',role:p[1].replace(' · Captain','')+(p[1].includes('Captain')?' · C':'')+(RL?'':' · '+['Kings','Hawks'][t]),st:p[6]||[['MATCHES',''+p[2]],['RUNS',p[3].toLocaleString('en-IN')],['STRIKE RATE',''+p[4]],['HIGH SCORE',''+p[5]]]}});
function draw(){g.innerHTML=R[team].map((p,i)=>`<button class="p ${i===cur?'sel':''}" data-i="${i}"><b>${p[0]}</b><small>${p[1]}</small></button>`).join('')}
const IMG={};async function photo(n){const k=n.toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();if(k in IMG)return IMG[k];let u='';try{const e=encodeURIComponent(n);const a=await (await fetch('/api/faces?names='+e)).json();u=(a.faces&&a.faces[k])||'';if(!u){const b=await (await fetch('/api/avatars?names='+e)).json();u=(b.avatars&&b.avatars[k])||''}}catch(x){}return IMG[k]=u}
async function show(){const p=R[team][cur];send('data',pack(p,team,p[7]||await photo(p[0])));send('screen','pi')}
g.onclick=e=>{const b=e.target.closest('.p');if(!b)return;cur=+b.dataset.i;draw();show()};
const tabs=document.getElementById('tabs');tabs.innerHTML=TEAM.map((n,i)=>`<button data-t="${i}" class="${i===0?'on':''}">${n}</button>`).join('');tabs.style.flexWrap='wrap';
tabs.onclick=e=>{const b=e.target.closest('button');if(!b)return;team=+b.dataset.t;cur=0;[...tabs.children].forEach((x,i)=>x.classList.toggle('on',i===team));draw();show()};
document.getElementById('src').textContent=RL?'Showing real players from this app ('+R.reduce((s,x)=>s+x.length,0)+').':'No players saved in this browser yet — showing sample roster. Open the app once here and they will load.';
document.getElementById('show').onclick=show;
document.getElementById('hide').onclick=()=>send('state','EXIT');
document.getElementById('nx').onclick=()=>{cur=(cur+1)%R[team].length;draw();show()};
const LAY=['royal-shield-b.html?screen=pi','royal-shield-intro-split.html?manual=1'];let ly=0;document.getElementById('ly').onclick=function(){ly=1-ly;this.textContent='STYLE '+(ly+1);f.src=LAY[ly]};
draw();f.onload=()=>setTimeout(show,300);
</script></body></html>
