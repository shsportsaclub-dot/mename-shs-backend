S.wp=d=>{const W=800,H=300,P=d.pts,px=i=>i*W/(P.length-1),py=v=>H-v*H/100,pa=P.map((v,i)=>[px(i),py(v)]),pb=P.map((v,i)=>[px(i),py(100-v)]),ln=a=>a.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return `<div class="pan" style="left:8cqw;right:8cqw;top:22cqh;bottom:12cqh;padding:2cqw 3cqw"><svg viewBox="-20 -10 840 330" style="width:100%;height:100%"><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="#ffffff30" stroke-dasharray="6 6"/><path class="drw" pathLength="1" d="${ln(pa)}" stroke="#5bc8f5" stroke-width="5" style="--i:0"/><path class="drw" pathLength="1" d="${ln(pb)}" stroke="#ff4d6d" stroke-width="5" style="--i:1"/></svg></div><div class="mid fade" style="position:absolute;left:11cqw;bottom:14cqh;color:#5bc8f5;--i:5">${d.a} ${d.pa}%</div><div class="mid fade" style="position:absolute;right:11cqw;bottom:14cqh;color:#ff6d86;--i:6">${d.b} ${100-d.pa}%</div>`};
S.drs=d=>{const st=(l,v,i)=>`<div class="pan fade" style="--i:${i};position:static;padding:2cqw;text-align:center"><div class="k">${l}</div><div class="big" style="font-size:4cqw;margin-top:1.6cqh;color:${v==='IN LINE'||v==='HITTING'?'var(--gn)':'var(--red)'}">${v}</div></div>`;return `<div class="cen" style="justify-content:flex-start;padding-top:20cqh"><div class="k" style="--i:0;font-size:2cqw">${d.bowl} (${d.by}) APPEALS · BATTER ${d.bat}</div><div style="display:grid;grid-template-columns:repeat(3,22cqw);gap:2cqw;margin-top:3cqh;opacity:1;transform:none">${st('PITCHING',d.pitch,1)+st('IMPACT',d.impact,2)+st('WICKETS',d.wk,3)}</div><div class="big" style="--i:5;font-size:14cqw;margin-top:4cqh;color:${d.verdict==='OUT'?'var(--red)':'var(--gn)'};text-shadow:0 0 4cqw currentColor">${d.verdict}</div><div class="sm" style="--i:6">${d.ump}</div></div>`};
S.bs=d=>`<div class="tbl"><div class="row h"><span>${up(d.team)}</span><b>O</b><b>M</b><b>R</b><b>W</b><b>ECON</b></div>${d.rows.map((r,i)=>`<div class="row ${r[4]===Math.max(...d.rows.map(x=>x[4]))&&i===0?'best':''}" style="--i:${i}"><span>${r[0]}</span><b>${r[1]}</b><b>${r[2]}</b><b>${r[3]}</b><b style="color:var(--gold2)">${r[4]}</b><b>${(r[3]/r[1]).toFixed(2)}</b></div>`).join('')}</div>`;
S.fw=d=>{const W=1000,mx=Math.max(...d.w.map(x=>x[0]))*1.05;return `<div class="pan" style="left:7cqw;right:7cqw;top:26cqh;bottom:18cqh"><svg viewBox="-30 -30 1060 260" style="width:100%;height:100%"><line x1="0" x2="${W}" y1="110" y2="110" stroke="var(--gold)" stroke-width="4"/>${d.w.map((x,i)=>{const px=x[0]/mx*W;return `<g class="pop" style="--i:${i*1.4}"><line x1="${px}" x2="${px}" y1="110" y2="${i%2?170:50}" stroke="#ffffff55"/><circle cx="${px}" cy="110" r="14" fill="var(--red)" stroke="#fff" stroke-width="3"/><text x="${px}" y="115" fill="#fff" font-size="15" font-weight="800" text-anchor="middle" font-family="var(--f)">${i+1}</text><text x="${px}" y="${i%2?195:30}" fill="#fff" font-size="22" font-weight="800" text-anchor="middle" font-family="var(--f)">${up(x[1])}</text><text x="${px}" y="${i%2?220:5}" fill="var(--gold)" font-size="18" text-anchor="middle" font-family="var(--f)">${x[0]} · ${x[2]} OV</text></g>`}).join('')}</svg></div><div class="mid" style="position:absolute;left:0;right:0;bottom:8cqh;text-align:center;color:var(--gold2)">${up(d.team)} ${d.total}</div>`};
S.wm=d=>{const W=800,H=300,mx=Math.max(...d.ra,...d.rb)*1.05,ln=(a,w)=>a.map((v,i)=>(i?'L':'M')+(i*W/(a.length-1)).toFixed(1)+' '+(H-v*H/mx).toFixed(1)).join(' '),dots=(a,w,c)=>w.map(o=>`<circle class="pop" style="--i:${o}" cx="${((o-1)*W/(a.length-1)).toFixed(1)}" cy="${(H-a[Math.min(o-1,a.length-1)]*H/mx).toFixed(1)}" r="7" fill="#fff" stroke="${c}" stroke-width="3"/>`).join('');return `<div class="pan" style="left:8cqw;right:8cqw;top:22cqh;bottom:12cqh;padding:2cqw 3cqw"><svg viewBox="-20 -10 840 330" style="width:100%;height:100%"><path class="drw" pathLength="1" d="${ln(d.ra)}" stroke="#5bc8f5" stroke-width="5"/><path class="drw" pathLength="1" d="${ln(d.rb)}" stroke="#ff4d6d" stroke-width="5" style="--i:1"/>${dots(d.ra,d.wa,'#5bc8f5')}${dots(d.rb,d.wb,'#ff4d6d')}</svg></div><div class="mid fade" style="position:absolute;left:11cqw;bottom:13.5cqh;color:#5bc8f5;--i:6">${up(d.a)} ${d.ra[d.ra.length-1]}</div><div class="mid fade" style="position:absolute;right:11cqw;bottom:13.5cqh;color:#ff6d86;--i:7">${up(d.b)} ${d.rb[d.rb.length-1]}</div>`};
S.vr=d=>`<div class="mid fade" style="position:absolute;left:0;right:0;top:18cqh;text-align:center;color:var(--gold)">${up(d.venue)} · ${d.m}</div><div class="tiles"><div class="tile" style="--i:0"><div class="k">AVG 1ST INNINGS</div><b>${d.avg}</b><div class="bar"><i style="width:70%"></i></div></div><div class="tile" style="--i:1"><div class="k">BAT FIRST WINS</div><b>${d.bat1}</b><div class="bar"><i style="width:${d.bat1}"></i></div></div><div class="tile" style="--i:2"><div class="k">HIGHEST TOTAL</div><b>${d.hs}</b><div class="bar"><i style="width:92%"></i></div></div><div class="tile" style="--i:3"><div class="k">LOWEST TOTAL</div><b>${d.lo}</b><div class="bar"><i style="width:35%"></i></div></div><div class="tile" style="--i:4"><div class="k">WICKETS TO PACE</div><b>${d.pace}</b><div class="bar"><i style="width:${d.pace}"></i></div></div><div class="tile" style="--i:5"><div class="k">WICKETS TO SPIN</div><b>${d.spin}</b><div class="bar"><i style="width:${d.spin}"></i></div></div></div>`;
S.wx=d=>`<div class="pan fade" style="left:6cqw;width:40cqw;top:24cqh;bottom:12cqh;--i:0;padding:2.4cqw"><div class="k">CONDITIONS</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:2cqh"><div class="big" style="font-size:10cqw;color:var(--gold2)">${d.temp}</div><svg viewBox="-50 -50 100 100" style="width:16cqw"><circle r="42" fill="none" stroke="#ffffff30" stroke-width="3"/><g style="transform:rotate(${d.dir}deg);transition:1s"><path d="M0 -34 L9 8 L0 2 L-9 8Z" fill="var(--cy)"/></g><text y="62" fill="#9fb2c7" font-size="10" text-anchor="middle" font-family="var(--f)">WIND ${d.wind}</text></svg></div><div class="mid" style="margin-top:3cqh">HUMIDITY ${d.hum}</div><div class="mid" style="margin-top:1.4cqh">RAIN ${d.rain}</div><div class="sm" style="margin-top:2.4cqh;color:var(--gold)">${d.dew}</div></div><div class="pan fade" style="right:6cqw;width:40cqw;top:24cqh;bottom:12cqh;--i:2;padding:2.4cqw"><div class="k">PITCH REPORT</div><div class="mid" style="margin:2cqh 0">${d.pitch}</div>${[['BOUNCE',d.bounce],['TURN',d.turn]].map(m=>`<div class="sm" style="margin-top:2cqh">${m[0]}</div><div class="tile" style="padding:0;border:0;background:none;opacity:1;transform:none"><div class="bar" style="height:2cqh;margin-top:1cqh"><i style="width:${m[1]}%"></i></div></div>`).join('')}</div>`;
S.h2h=d=>{const t=d.wa+d.wb;return `<div class="mid fade" style="position:absolute;left:6cqw;top:24cqh;color:#5bc8f5;font-size:3.6cqw;--i:0">${up(d.a)}</div><div class="mid fade" style="position:absolute;right:6cqw;top:24cqh;color:#ff6d86;font-size:3.6cqw;text-align:right;--i:0">${up(d.b)}</div><div class="big fade" style="position:absolute;left:0;right:0;top:30cqh;text-align:center;font-size:9cqw;--i:1;color:var(--gold2)">${d.pl}<div class="k">MATCHES PLAYED</div></div><svg viewBox="0 0 1000 60" style="position:absolute;left:6cqw;right:6cqw;top:56cqh;width:88cqw"><rect class="growx" style="--i:2" x="0" y="10" width="${d.wa/t*1000}" height="40" fill="#5bc8f5"/><rect class="growx" style="--i:2;transform-origin:right" x="${d.wa/t*1000}" y="10" width="${d.wb/t*1000}" height="40" fill="#ff4d6d"/><text x="14" y="40" fill="#06182a" font-size="30" font-weight="900" font-family="var(--f)">${d.wa} WINS</text><text x="986" y="40" fill="#fff" font-size="30" font-weight="900" text-anchor="end" font-family="var(--f)">${d.wb} WINS</text></svg><div class="fade" style="position:absolute;left:6cqw;top:68cqh;--i:4"><div class="k" style="margin-bottom:1cqh">LAST 5</div>${d.last.map(x=>`<span class="chip ${x}">${x.toUpperCase()}</span>`).join('')}</div><div class="fade" style="position:absolute;right:6cqw;top:68cqh;text-align:right;--i:4"><div class="k" style="margin-bottom:1cqh">LAST 5</div>${d.lastb.map(x=>`<span class="chip ${x}">${x.toUpperCase()}</span>`).join('')}</div><div class="sm fade" style="position:absolute;left:0;right:0;bottom:8cqh;text-align:center;--i:5">HIGHEST: ${d.hs[0]} · ${d.hs[1]}</div>`};
S.pp=d=>{const mx=Math.max(...d.ov)+4,bw=100;return `<div class="pan" style="left:6cqw;width:58cqw;top:22cqh;bottom:12cqh;padding:2cqw"><svg viewBox="0 0 660 300" style="width:100%;height:100%">${d.ov.map((v,i)=>{const h=v/mx*250,x=i*108+10;return `<rect class="grow" style="--i:${i}" x="${x}" y="${270-h}" width="88" height="${h}" rx="5" fill="${d.wk[i]?'#d32f4a':'#5bc8f5'}"/><text x="${x+44}" y="${262-h}" fill="#fff" font-size="28" font-weight="800" text-anchor="middle" font-family="var(--f)">${v}</text><text x="${x+44}" y="295" fill="#9fb2c7" font-size="20" text-anchor="middle" font-family="var(--f)">OV ${i+1}</text>`}).join('')}</svg></div><div class="pan fade" style="right:6cqw;width:28cqw;top:22cqh;bottom:12cqh;padding:2.4cqw;--i:3"><div class="k">${up(d.team)} · POWERPLAY</div><div class="big" style="margin:2cqh 0;color:var(--gold2)">${d.score}</div><div class="mid">RUN RATE ${d.rr}</div><div class="mid" style="margin-top:1.4cqh">FOURS ${d.f}</div><div class="mid" style="margin-top:1.4cqh">SIXES ${d.s}</div></div>`};
S.sd=d=>{const t=d.d.reduce((a,x)=>a+x[1],0);let a0=0,arcs='';d.d.forEach((x,i)=>{const a1=a0+x[1]/t,p=a=>[Math.cos(a*6.2832-1.5708)*80,Math.sin(a*6.2832-1.5708)*80];const [x0,y0]=p(a0),[x1,y1]=p(a1);arcs+=`<path class="pop" style="--i:${i*1.2}" d="M${x0.toFixed(1)} ${y0.toFixed(1)} A80 80 0 ${a1-a0>.5?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${x[2]}" stroke-width="24"/>`;a0=a1});return `<svg viewBox="-110 -110 220 220" style="position:absolute;left:12cqw;top:20cqh;width:36cqw;height:36cqw">${arcs}<text y="6" fill="#fff" font-size="26" font-weight="900" text-anchor="middle" font-family="var(--f)">${t}</text><text y="22" fill="#9fb2c7" font-size="10" text-anchor="middle" font-family="var(--f)">BALLS FACED</text></svg><div class="pan fade" style="right:10cqw;width:34cqw;top:24cqh;padding:2.4cqw;--i:2"><div class="k">${up(d.n)}</div>${d.d.map(x=>`<div style="display:flex;justify-content:space-between;font:800 2.4cqw/1 var(--f);margin-top:1.6cqh"><span><i style="display:inline-block;width:1.4cqw;height:1.4cqw;border-radius:50%;background:${x[2]};margin-right:1cqw"></i>${x[0].toUpperCase()}</span><b>${x[1]} · ${Math.round(x[1]/t*100)}%</b></div>`).join('')}</div>`};
S.bh=d=>{const mx=Math.max(...d.z.map(z=>z[1]));return `<div style="position:absolute;left:12cqw;top:22cqh;width:50cqw;height:62cqh;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:1cqw;perspective:1200px">${d.z.map((z,i)=>{const k=z[1]/mx;return `<div class="pop" style="--i:${i};background:rgba(${Math.round(60+195*k)},${Math.round(120-70*k)},${Math.round(200-150*k)},${.35+.6*k});border:.15cqw solid #ffffff44;display:grid;place-items:center;text-align:center;border-radius:.6cqw"><div><b style="font:900 4.6cqw/1 var(--f)">${z[1]}</b><div class="sm" style="color:#fff;font-size:1.3cqw">${d.lab[i]}</div>${z[2]?`<div class="sm" style="color:#fff;margin-top:.4cqh;font-size:1.3cqw">${z[2]} W</div>`:''}</div></div>`}).join('')}</div><div class="pan fade" style="right:10cqw;width:26cqw;top:24cqh;padding:2.4cqw;--i:4"><div class="k">BOWLER</div><div class="mid" style="margin:1.4cqh 0">${d.n}</div><div class="sm">Hottest zone: <b style="color:var(--gold2)">${d.lab[d.z.findIndex(z=>z[1]===mx)]}</b></div><div class="sm" style="margin-top:1.2cqh">${d.z.reduce((a,z)=>a+z[1],0)} balls tracked</div></div>`};
S.rr=d=>{const mx=18,ang=v=>-120+Math.min(v,mx)/mx*240;return `<svg viewBox="-110 -90 220 150" style="position:absolute;left:30cqw;top:18cqh;width:40cqw"><path d="M-80 40 A80 80 0 1 1 80 40" fill="none" stroke="#17304d" stroke-width="16" stroke-linecap="round"/><path class="drw" pathLength="1" d="M-80 40 A80 80 0 1 1 80 40" stroke="url(#rg)" stroke-width="16" stroke-linecap="round"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#2cff8a"/><stop offset=".5" stop-color="#ffd45a"/><stop offset="1" stop-color="#d32f4a"/></linearGradient></defs><g style="transform:rotate(${ang(d.rrr)}deg);transition:transform 1.6s 1s cubic-bezier(.2,1.3,.3,1)" class="ndl"><path d="M-3 0 L0 -66 L3 0Z" fill="#fff"/></g><circle r="8" fill="var(--gold)"/><text y="34" fill="#fff" font-size="26" font-weight="900" text-anchor="middle" font-family="var(--f)">${d.rrr}</text><text y="48" fill="#9fb2c7" font-size="9" text-anchor="middle" font-family="var(--f)">REQUIRED RATE</text></svg><div class="mid fade" style="position:absolute;left:0;right:0;top:66cqh;text-align:center;font-size:3.6cqw;color:var(--gold2);--i:3">${up(d.team)} NEED ${d.need} OFF ${d.balls}</div><div class="sm fade" style="position:absolute;left:0;right:0;top:77cqh;text-align:center;font-size:2.2cqw;--i:4">CURRENT RATE ${d.crr} · TARGET ${d.tgt}</div>`};
S.pom=d=>`<div class="burst"></div><div class="cen"><div class="k" style="--i:0;font-size:2.4cqw">PLAYER OF THE MATCH</div><svg viewBox="0 0 100 70" style="--i:1;width:14cqw"><path d="M20 5h60v18c0 18-12 28-30 28S20 41 20 23z" fill="#e6bd6a" stroke="#fff3ba" stroke-width="2"/><path d="M20 10H8c0 14 6 22 14 24M80 10h12c0 14-6 22-14 24" fill="none" stroke="#e6bd6a" stroke-width="4"/><rect x="42" y="50" width="16" height="10" fill="#bf8c38"/><rect x="30" y="60" width="40" height="7" rx="2" fill="#e6bd6a"/></svg><div class="big" style="--i:2;font-size:8cqw;background:linear-gradient(180deg,var(--gold2),var(--gold),var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent">${up(d.n)}</div><div class="mid" style="--i:3">${d.line}</div><div class="sm" style="--i:4">${d.team}</div></div><div class="cfw">${CF(60)}</div>`;
function render(){document.getElementById('scs').innerHTML=Object.keys(S).map(k=>`<div class="sc" id="${k}">${S[k](D[k])}</div>`).join('')}
function show(n){cur=n;document.querySelectorAll('.sc').forEach(e=>e.classList.toggle('on',e.id===n));ttl.textContent=TT[n]||'';sub.textContent='ROYAL SHIELD / '+up(T[n]||n)}
window.shTheme={id:'SH-RS-V6-B',state(s){B.classList.remove('in','out');void B.offsetWidth;if(s==='ENTER'){show(cur);B.classList.add('in')}else if(s==='EXIT')B.classList.add('out');else if(s==='HOLD')B.classList.add('in')},screen(n){cur=n;this.state('ENTER')},data(d){for(const k in d)D[k]=(D[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))?Object.assign({},D[k],d[k]):d[k];render();show(cur)},event(ev,p){const m={MATCH_OPENING:'mo',LIVE_SCORE:'ls',PLAYER_INTRO:'pi',FIELD_SET:'fp',PITCH_MAP:'pm',WIN_PROB:'wp',DRS_REVIEW:'drs',BOWLING_CARD:'bs',FALL_OF_WICKETS:'fw',WORM:'wm',VENUE_REPORT:'vr',WEATHER:'wx',HEAD_TO_HEAD:'h2h',POWERPLAY_DONE:'pp',SHOT_DIST:'sd',BOWLER_HEAT:'bh',RRR:'rr',PLAYER_OF_MATCH:'pom'}[ev];if(m){this.data({[m]:p});this.screen(m)}}};
addEventListener('message',e=>{const d=e.data||{};if(d.shTheme)shTheme[d.fn](...(d.args||[]))});
render();shTheme.state('ENTER');
</script></body></html>
