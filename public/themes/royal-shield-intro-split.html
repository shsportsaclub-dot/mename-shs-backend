<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Shield Split Player Intro</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#fff;font-family:'Barlow Condensed',Arial,sans-serif;overflow:hidden}
body.bg{background:#020918}
.st{position:absolute;left:50%;top:50%;width:min(100vw,177.7778vh);aspect-ratio:16/9;transform:translate(-50%,-50%);container-type:size;overflow:hidden}
.L{position:absolute;left:0;top:0;width:46cqw;height:100%;clip-path:polygon(0 0,94% 0,100% 50%,92% 100%,0 100%);background:radial-gradient(ellipse at 40% 35%,#2a6fb0,#0a2145 60%,#030a1a);transform:translateX(-105%)}
.L:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(100deg,#ffffff08 0 2cqw,transparent 2cqw 4cqw)}
.L .ph{position:absolute;left:6cqw;bottom:0;width:34cqw;height:86cqh}.L .ph svg,.L .ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.P{position:absolute;left:42cqw;right:0;top:0;bottom:0;background:linear-gradient(95deg,#06152ce8,#05152df5 65%,#041024f9);clip-path:polygon(8% 0,100% 0,100% 100%,0 100%);transform:translateX(105%)}
.G{position:absolute;left:43cqw;top:-5cqh;height:110cqh;width:.5cqw;transform:rotate(10deg) scaleY(0);transform-origin:top;background:linear-gradient(#b16a1d,#fff1b3,#b57b28);box-shadow:0 0 3cqw #f9b843;z-index:2}
.H{position:absolute;top:5cqh;right:5cqw;text-align:right;font-size:3.6cqw;font-weight:800;letter-spacing:.09em;opacity:0}.H small{display:block;font-size:1.3cqw;color:#ffd07d;letter-spacing:.34em;margin-top:.8cqh}
.C{position:absolute;left:51cqw;right:4cqw;top:20cqh;z-index:3}.C>*{opacity:0;transform:translateX(5cqw)}
.eb{color:#ffd27d;font-size:1.6cqw;font-weight:700;letter-spacing:.3em}
.nm{font-size:6.4cqw;line-height:.9;font-weight:800;margin:1.5cqh 0 2cqh;text-transform:uppercase;text-shadow:.3cqw .4cqw 0 #09112c,0 0 3cqw #b87530}
.ru{height:.5cqh;background:linear-gradient(90deg,#fff2b1,#d58a2c,transparent);transform-origin:left;transform:scaleX(0)!important}
.tm{margin-top:2cqh;font-weight:800;color:#fbd58c;font-size:3cqw;letter-spacing:.06em}.rl{font-size:1.7cqw;letter-spacing:.2em;color:#c7e5ff}
.ss{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1cqw;margin-top:4cqh}.s{border:1px solid #d7aa62;background:linear-gradient(155deg,#16467b,#05162e);border-radius:.6cqw;text-align:center;padding:2cqh .3cqw;box-shadow:inset 0 0 2cqw #175ba455;opacity:0;transform:translateY(3cqh)}
.s b{display:block;font-size:4.4cqw;color:#fff4d3;font-weight:800}.s span{font-size:1.1cqw;letter-spacing:.1em;color:#c5d9ec}
.ex{margin-top:3cqh;display:flex;gap:4cqw;font-weight:700;color:#ffda8d;font-size:1.8cqw}
.J{position:absolute;left:5cqw;bottom:9cqh;z-index:3;font-size:15cqw;font-weight:800;color:#ffe4a4;text-shadow:0 0 3cqw #dc8c31,.5cqw .7cqw 0 #0a1d42;opacity:0}
.B{position:absolute;bottom:0;left:0;right:0;height:1.6cqh;background:linear-gradient(90deg,#0557ad,#e9ae51,#9e1d48);z-index:4;transform:scaleX(0);transform-origin:left}
.SH{position:absolute;z-index:4;top:-40%;left:-30%;width:8%;height:180%;transform:rotate(24deg);background:linear-gradient(90deg,transparent,#fff9d150,transparent);opacity:0}
.in .L{animation:sl .8s cubic-bezier(.2,.9,.2,1) both}.in .P{animation:sr .8s .15s cubic-bezier(.2,.9,.2,1) both}.in .G{animation:gs .6s .5s ease-out both}.in .H{animation:fd .6s .9s both}
.in .C>*{animation:ci .6s both;animation-delay:calc(.8s + var(--i)*.14s)}.in .ru{animation:ru .7s 1.2s both}.in .s{animation:su .5s both;animation-delay:calc(1.5s + var(--i)*.12s)}
.in .J{animation:fd .8s 1s both}.in .B{animation:bw 1s 1.8s both}.in .SH{animation:shn 1.6s 2s ease-in-out both}
.out .L{animation:slo .6s both}.out .P{animation:sro .6s both}.out .C,.out .G,.out .H,.out .J,.out .B{opacity:0;transition:opacity .3s}
@keyframes sl{to{transform:none}}@keyframes sr{to{transform:none}}@keyframes slo{from{transform:none}to{transform:translateX(-105%)}}@keyframes sro{from{transform:none}to{transform:translateX(105%)}}
@keyframes gs{to{transform:rotate(10deg) scaleY(1)}}@keyframes fd{to{opacity:1}}@keyframes ci{to{opacity:1;transform:none}}@keyframes ru{to{transform:scaleX(1)}}@keyframes su{to{opacity:1;transform:none}}@keyframes bw{to{transform:scaleX(1)}}@keyframes shn{0%{left:-30%;opacity:1}100%{left:150%;opacity:1}}
</style></head><body><div class="st" id="st"><div class="L"><div class="ph" id="ph"></div></div><div class="P"></div><div class="G"></div><div class="H">SCORING HEROES<small>ROYAL SHIELD · PLAYER INTRO</small></div><div class="J" id="no"></div>
<section class="C"><div class="eb" style="--i:0">PLAYER SPOTLIGHT</div><div class="nm" id="nm" style="--i:1"></div><div class="ru" style="--i:2"></div><div class="tm" id="tm" style="--i:3"></div><div class="rl" id="rl" style="--i:4"></div><div class="ss" id="ss" style="--i:5;opacity:1;transform:none"></div><div class="ex" id="ex" style="--i:9"></div></section><div class="SH"></div><div class="B"></div></div>
<script>
const SIL=c=>`<svg viewBox="0 0 100 120" preserveAspectRatio="xMidYMax meet"><circle cx="50" cy="38" r="20" fill="${c}"/><path d="M8 120c0-34 18-50 42-50s42 16 42 50z" fill="${c}"/></svg>`;
const q=new URLSearchParams(location.search);if(q.get('bg'))document.body.classList.add('bg');
let D={name:'Hemanth',team:'SKY HIGH KINGS',role:'ALL-ROUNDER',number:'',img:'',stats:[['MATCHES','90'],['RUNS','377'],['AVERAGE','9.43'],['HIGH SCORE','115*']],extras:[]};
const B=document.body,st=document.getElementById('st');
function render(){document.getElementById('ph').innerHTML=D.img?`<img src="${D.img}">`:SIL('#3a86d6');
 document.getElementById('nm').innerHTML=String(D.name).toUpperCase().split(' ').join('<br>');document.getElementById('tm').textContent=D.team;document.getElementById('rl').textContent=D.role;document.getElementById('no').textContent=D.number||'';
 document.getElementById('ss').innerHTML=D.stats.map((x,i)=>`<div class="s" style="--i:${i}"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
 document.getElementById('ex').innerHTML=(D.extras||[]).map(x=>`<span>${x[0]}: <b>${x[1]}</b></span>`).join('')}
function state(s){B.classList.remove('in','out');void B.offsetWidth;if(s==='ENTER'||s==='HOLD')B.classList.add('in');else if(s==='EXIT')B.classList.add('out')}
window.shTheme={id:'SH-RS-INTRO-SPLIT',state,screen(){render();state('ENTER')},data(d){const x=d.pi||d;const m=Object.assign({},x);if(x.n!==undefined)m.name=x.n;if(x.st!==undefined)m.stats=x.st;if(x.tm!==undefined)m.team=x.tm;if(x.rl!==undefined)m.role=x.rl;D=Object.assign({},D,m);render()},event(e,p){if(e==='PLAYER_INTRO'){this.data(p);this.screen()}}};
addEventListener('message',e=>{const m=e.data;if(m&&m.shTheme&&window.shTheme[m.fn])window.shTheme[m.fn](...(m.args||[]))});
render();if(!q.get('manual'))setTimeout(()=>state('ENTER'),200);
</script></body></html>
