<!doctype html><html><head><meta charset="utf-8"><title>SH-TK-00001-SCR-001 Tournament Season Schedule</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}
body.prev{background:linear-gradient(160deg,#17361f,#0b1d12 60%,#243b2a)}
#st{position:absolute;inset:0;perspective:1800px;perspective-origin:50% 38%;container-type:size}
#rig{position:absolute;inset:0;transform-style:preserve-3d;transform:scale(.9) rotateX(14deg) rotateY(-9deg);transition:transform 6s ease-in-out}
.hold #rig{transform:scale(.9) rotateX(11deg) rotateY(7deg)}
.badge{position:absolute;left:5cqw;top:6cqh;display:flex;gap:2cqw;align-items:center;transform:translateZ(120px)}
.badge i{width:7cqw;height:7cqw;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:conic-gradient(from 30deg,#ffd45a,#fff2b0,#c98a12,#ffd45a);display:grid;place-items:center;color:#3a2600;font:900 2.4cqw/1 inherit}
.badge b{color:#fff;font:800 4.2cqw/1 inherit;letter-spacing:.25cqw;text-transform:uppercase;text-shadow:0 .4cqw 1cqw #0008}
.badge em{display:block;color:#ffd45a;font:600 1.9cqw/1.2 inherit;letter-spacing:.5cqw;font-style:normal}
.rail{position:absolute;left:6cqw;right:6cqw;top:56cqh;height:.7cqh;background:linear-gradient(90deg,transparent,#ffd45a,#fff,#ffd45a,transparent);transform:translateZ(20px);box-shadow:0 0 3cqw #ffd45a99;transform-origin:left;}
.cards{position:absolute;left:5cqw;right:5cqw;top:24cqh;bottom:12cqh;display:flex;gap:2.2cqw;transform-style:preserve-3d}
.c{flex:1;position:relative;transform-style:preserve-3d;transform:translateZ(var(--z,0px)) translateY(calc(var(--i)*-1.1cqh));opacity:0;animation:none}
.c .f{position:absolute;inset:0;border-radius:1.6cqw;background:linear-gradient(165deg,#ffffff1f,#ffffff08),linear-gradient(200deg,var(--a),var(--b));border:.15cqw solid #ffffff55;box-shadow:inset 0 .3cqw .6cqw #fff5,0 2.4cqh 4cqh #0008;padding:2.2cqw;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;color:#fff;overflow:hidden}
.c .f:after{content:"";position:absolute;inset:-40% -60%;background:linear-gradient(100deg,transparent 40%,#fff4 50%,transparent 60%);transform:translateX(-80%);animation:sh 5s ease-in-out infinite;animation-delay:calc(var(--i)*.4s)}
.c .s{position:absolute;left:0;right:0;bottom:-1.6cqh;height:1.6cqh;background:linear-gradient(var(--b),#000a);transform-origin:top;transform:rotateX(-90deg);border-radius:0 0 1.2cqw 1.2cqw}
.d{font:700 1.8cqw/1 inherit;letter-spacing:.35cqw;text-transform:uppercase;color:#ffe9a8}
.vs{display:flex;flex-direction:column;gap:.6cqw}
.t{font:800 3.4cqw/.95 inherit;text-transform:uppercase;text-shadow:0 .3cqw .8cqw #0007}
.x{font:600 1.6cqw/1 inherit;color:#d9e6ff;opacity:.9;letter-spacing:.2cqw}
.tm{font:900 3.6cqw/1 inherit;color:#fff}
.st{align-self:flex-start;font:800 1.4cqw/1 inherit;letter-spacing:.3cqw;padding:.6cqw 1.1cqw;border-radius:99px;background:#ffd45a;color:#3a2600}
.st.chg{background:#ff5a4d;color:#fff;animation:bl 1.2s steps(2) 3}
.st.live{background:#2cff8a;color:#06331a}
@keyframes sh{0%,55%{transform:translateX(-80%)}100%{transform:translateX(80%)}}
@keyframes bl{50%{opacity:.3}}
.enter .c{animation:en .9s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*.12s + .2s)}
.enter .badge{animation:bd .7s ease-out both}.enter .rail{animation:rl 1.1s ease-out both}
.hold .c{opacity:1;animation:fl 6s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.8s)}
.exit .c{animation:ex .6s ease-in both;animation-delay:calc(var(--i)*.06s)}
.exit .badge,.exit .rail{opacity:0;transition:opacity .5s}
@keyframes en{from{opacity:0;transform:translateZ(-700px) translateY(18cqh) rotateX(50deg)}to{opacity:1;transform:translateZ(var(--z,0px)) translateY(calc(var(--i)*-1.1cqh))}}
@keyframes ex{to{opacity:0;transform:translateZ(500px) translateY(-14cqh) rotateX(-35deg)}}
@keyframes fl{to{transform:translateZ(calc(var(--z,0px) + 26px)) translateY(calc(var(--i)*-1.1cqh - .6cqh))}}
@keyframes bd{from{opacity:0;transform:translateZ(120px) translateX(-6cqw)}}
@keyframes rl{from{transform:translateZ(20px) scaleX(0)}}
</style></head><body class="">
<div id="st"><div id="rig"><div class="badge"><i>SH</i><div><b id="tn"></b><em id="sn"></em></div></div><div class="rail"></div><div class="cards" id="cs"></div></div></div>
<script>
const Q=new URLSearchParams(location.search);if(Q.get('preview')!=='0'&&Q.get('bg')==='1')document.body.classList.add('prev');
const PAL=[['#1f5bd6','#0b2a7a'],['#c7253c','#6a0f23'],['#7a2cc9','#2f0f66'],['#0e9a78','#064a3b'],['#d9780f','#7a3a05']];
const DEMO={tournament:'SH Premier League',season:'Season 3 · 2026',matches:[
{id:'m1',home:'Sky High Kings',away:'Hapur Hawks',venue:'SH Arena, Hapur',start:'2026-11-09T19:30',status:'scheduled'},
{id:'m2',home:'Ganga Giants',away:'Delhi Dynamos',venue:'Central Ground',start:'2026-11-10T15:00',status:'time_changed'},
{id:'m3',home:'Meerut Mavericks',away:'Noida Nighthawks',venue:'Stadium Road Oval',start:'2026-11-11T19:30',status:'scheduled'},
{id:'m4',home:'Lucknow Lions',away:'Agra Avengers',venue:'Heritage Park',start:'2026-11-12T15:00',status:'live'}]};
const fmt=s=>{const d=new Date(s);return{d:d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}),t:d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}};
const LBL={scheduled:'UPCOMING',time_changed:'TIME CHANGED',live:'LIVE NOW',result:'FINISHED'};
let D=DEMO;
function render(){document.getElementById('tn').textContent=D.tournament;document.getElementById('sn').textContent=D.season;
 const ms=[...D.matches].sort((a,b)=>new Date(a.start)-new Date(b.start));   // schedule ordering
 document.getElementById('cs').innerHTML=ms.map((m,i)=>{const f=fmt(m.start),p=PAL[i%PAL.length],c=m.status==='time_changed'?'chg':m.status==='live'?'live':'';
 return`<div class="c" data-id="${m.id}" style="--i:${i};--a:${p[0]};--b:${p[1]};--z:${(i%2)*34}px"><div class="f"><div class="d">${f.d}</div><div class="vs"><div class="t">${m.home}</div><div class="x">VS</div><div class="t">${m.away}</div></div><div><div class="tm">${f.t}</div><div class="x">${m.venue}</div></div><div class="st ${c}">${LBL[m.status]||m.status}</div></div><div class="s"></div></div>`}).join('')}
const B=document.body,set=s=>{B.classList.remove('enter','hold','exit');B.classList.add(s)};
window.shTheme={id:'SH-TK-00001-SCR-001',
 state(s){if(s==='ENTER'){set('enter');setTimeout(()=>set('hold'),1900)}else if(s==='HOLD')set('hold');else if(s==='EXIT')set('exit')},
 data(d){D=d;render()},                       // UPDATE: re-bind data
 event(ev,p){if(ev==='SCHEDULE_PUBLISHED'){this.data(p);this.state('ENTER')}
   if(ev==='MATCH_TIME_CHANGED'||ev==='MATCH_STATUS_CHANGED'){const m=D.matches.find(x=>x.id===p.match_id);if(m){Object.assign(m,p.patch);render();set('hold')}}}};
window.addEventListener('message',e=>{const d=e.data||{};if(d.shTheme)window.shTheme[d.fn](...(d.args||[]))});
render();window.shTheme.state(Q.get('state')||'ENTER');
</script></body></html>
