<!doctype html><html><head><meta charset="utf-8"><title>Royal Shield C</title>
<style>
:root{--f:'Barlow Condensed','Arial Narrow','DejaVu Sans',sans-serif;--gold:#e6bd6a;--gold2:#fff3ba;--gold3:#bf8c38;--cy:#5bc8f5;--red:#d32f4a;--gn:#2cff8a}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font-family:var(--f);color:#fff}
body.bg{background:radial-gradient(120% 90% at 50% 0%,#0b1a30,#050c18 70%)}
#st{position:absolute;inset:0;container-type:size;perspective:2000px}
.beam{position:absolute;top:0;bottom:0;width:36cqw;opacity:0;transition:opacity 1s}.beam.l{left:0;background:linear-gradient(100deg,#075bb688,transparent 80%);clip-path:polygon(0 0,100% 0,60% 100%,0 100%)}.beam.r{right:0;background:linear-gradient(260deg,#d32f4a88,transparent 80%);clip-path:polygon(0 0,100% 0,100% 100%,40% 100%)}.in .beam{opacity:1}
.hd{position:absolute;left:5cqw;right:5cqw;top:3cqh;display:flex;justify-content:space-between;align-items:baseline;border-bottom:.25cqh solid var(--gold);padding-bottom:1.2cqh;opacity:0;transform:translateY(-3cqh)}.hd b{font:800 2.4cqw/1 var(--f);letter-spacing:.3cqw}.hd span{color:var(--gold);font:600 1.5cqw/1 var(--f);letter-spacing:.3cqw;text-transform:uppercase}
.ttl{position:absolute;left:0;right:0;top:10cqh;text-align:center;font:800 4.4cqw/1 var(--f);letter-spacing:.4cqw;text-transform:uppercase;background:linear-gradient(180deg,var(--gold2),var(--gold) 50%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
.in .hd{animation:dn .7s .1s both}.in .ttl{animation:dn .8s .25s both}.out .sc{animation:ot .6s ease-in both}.out .hd{opacity:0;transition:.4s}
@keyframes dn{to{opacity:1;transform:none}}@keyframes ot{to{opacity:0;transform:translateZ(400px) scale(1.06)}}@keyframes sl{to{opacity:1;transform:none}}@keyframes rise{to{opacity:1;transform:none}}
.sc{position:absolute;inset:0;display:none}.sc.on{display:block}
.pan{box-sizing:border-box;position:absolute;background:linear-gradient(#101f33f2,#0a1524f2);border:.15cqw solid var(--gold3);border-radius:.8cqw}
.k{font:600 1.5cqw/1 var(--f);letter-spacing:.25cqw;color:var(--gold);text-transform:uppercase}.big{font:900 7cqw/1 var(--f)}.mid{font:800 3cqw/1 var(--f);text-transform:uppercase}.sm{font:600 1.8cqw/1.2 var(--f);color:#9fb2c7;text-transform:uppercase}
.pop{opacity:0;transform:scale(.4)}.in .pop{animation:pp .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*.1s + .8s)}@keyframes pp{to{opacity:1;transform:none}}
.fade{opacity:0;transform:translateY(3cqh)}.in .fade{animation:dn .6s both;animation-delay:calc(var(--i,0)*.12s + .7s)}
.drw{stroke-dasharray:1;stroke-dashoffset:1;fill:none}.in .drw{animation:dw 1.6s cubic-bezier(.3,.7,.3,1) both;animation-delay:calc(var(--i,0)*.25s + .8s)}@keyframes dw{to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}.in .grow{animation:gy .7s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*.07s + .8s)}@keyframes gy{to{transform:none}}
.growx{transform-box:fill-box;transform-origin:left;transform:scaleX(0)}.in .growx{animation:gx 1s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*.1s + .8s)}@keyframes gx{to{transform:none}}
svg{overflow:visible}
/* C: events / standings / ball-by-ball */
.stage{position:absolute;inset:0}.ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.6cqh}.ctr>*{opacity:0;transform:scale(.7)}.in .ctr>*{animation:sl .7s both;animation-delay:calc(var(--i,0)*.25s + .5s)}
.hug{font:900 11cqw/1 var(--f);text-transform:uppercase}.gold{background:linear-gradient(180deg,var(--gold2),var(--gold),var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.tbl{position:absolute;left:10cqw;right:10cqw;top:22cqh;display:flex;flex-direction:column;gap:1.1cqh}
.tcol{display:grid;grid-template-columns:3cqw 1fr 6cqw 6cqw 7cqw 7cqw;gap:1cqw;align-items:center;padding:1cqh 1.6cqw;background:linear-gradient(90deg,#0f213a,#0a1626);border-left:.4cqw solid var(--gold3);font:700 1.9cqw/1 var(--f);text-transform:uppercase;opacity:0;transform:translateX(-5cqw)}.tcol.q{border-left-color:var(--gn)}.tcol.h{background:none;color:var(--gold);font-size:1.3cqw;border-left-color:transparent}.tcol b{text-align:right}.in .tcol{animation:sl .5s both;animation-delay:calc(var(--i)*.09s + .5s)}
.curtain{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#0b2a4c,#07162b);z-index:5;border:0 solid var(--gold)}.curtain.l{left:0;border-right-width:.4cqw}.curtain.r{right:0;border-left-width:.4cqw}.in .curtain.l{animation:cl 1.2s 1.2s cubic-bezier(.7,0,.3,1) both}.in .curtain.r{animation:cr2 1.2s 1.2s cubic-bezier(.7,0,.3,1) both}@keyframes cl{to{transform:translateX(-101%)}}@keyframes cr2{to{transform:translateX(101%)}}
.ringt{width:30cqw;height:30cqw}.ringt circle{fill:none;stroke-width:12;stroke-linecap:round}.ringt .fg{stroke-dasharray:1;stroke-dashoffset:0}.in .ringt .fg{animation:rdn var(--dur,6s) linear .8s both}@keyframes rdn{to{stroke-dashoffset:1}}
.rain{position:absolute;inset:0;overflow:hidden}.rain i{position:absolute;top:-10cqh;width:.12cqw;height:5cqh;background:linear-gradient(transparent,#8ec9ff);opacity:.7;animation:rn 1s linear infinite;animation-delay:var(--d)}@keyframes rn{to{transform:translateY(120cqh) translateX(-4cqw)}}
.stripe{position:absolute;left:0;right:0;height:5cqh;background:repeating-linear-gradient(-45deg,#ffd45a 0 2cqw,#111 2cqw 4cqw);opacity:0}.in .stripe{animation:dn .6s .3s both,mv 2s linear infinite}@keyframes mv{to{background-position:8cqw 0}}
.bolt{filter:drop-shadow(0 0 2cqw #ffd45a)}.fk{animation:fk 1.2s steps(2) infinite}@keyframes fk{50%{opacity:.55}}@keyframes spn{to{transform:rotate(360deg)}}
.ballc{width:9cqw;height:9cqw;border-radius:50%;display:grid;place-items:center;font:900 4cqw/1 var(--f);border:.4cqw solid #ffffff55;background:#0c1c30;opacity:0;transform:scale(.3) rotate(-90deg)}.in .ballc{animation:pp .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*.4s + .8s)}
.ballc.f{background:#ffd45a;color:#3a2600}.ballc.s{background:#ff4d6d}.ballc.w{background:#fff;color:#d32f4a;border-color:#d32f4a}.ballc.d{color:#5bc8f5}.ballc.e{background:#ecb654;color:#3a2600}
.qt{font:600 3.4cqw/1.3 var(--f);max-width:70cqw}.qt:after{content:"|";animation:fk .8s steps(2) infinite}
.type{overflow:hidden;white-space:nowrap;width:0}.in .type{animation:ty 1.8s steps(8) .8s both}@keyframes ty{to{width:100%}}
.cm{position:absolute;left:8cqw;right:8cqw;bottom:10cqh;padding:2.4cqw 3cqw;background:linear-gradient(90deg,#063a6b,#0a1626 70%);border:.15cqw solid var(--gold3);border-left:.8cqw solid var(--gold);opacity:0;transform:translateY(6cqh)}.in .cm{animation:sl .6s .4s both}
.ib{position:absolute;top:26cqh;width:40cqw;height:44cqh;text-align:center;opacity:0;display:flex;flex-direction:column;justify-content:center;gap:1.5cqh}.ib.a{left:8cqw;transform:translateX(-10cqw)}.ib.b{right:8cqw;transform:translateX(10cqw);border-color:var(--red)}.in .ib.a{animation:sl .8s .5s both}.in .ib.b{animation:sl .8s .8s both}
.rcd{transform-box:fill-box}.rc{animation:rc 1.6s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*.15s + .8s)}@keyframes rc{from{transform:translateX(0)}to{transform:translateX(var(--x))}}
@keyframes bf{from{offset-distance:0%}to{offset-distance:100%}}@keyframes dtp{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(8)}}@keyframes sl2{to{transform:skewY(-4deg) translateX(0)}}@keyframes spn2{to{transform:rotate(360deg)}}
</style></head>
<body><div id="st"><div class="beam l"></div><div class="beam r"></div><div class="hd"><b>SCORING HEROES</b><span id="sub"></span></div><div class="ttl" id="ttl"></div><div id="scs"></div></div><script>
const Q=new URLSearchParams(location.search),B=document.body;if(Q.get('bg')==='1')B.classList.add('bg');
const up=s=>String(s).toUpperCase();
const D={sc:{a:'Sky High Kings',b:'Hapur Hawks',score:'243/6',ov:'20.0',tgt:244,rr:'12.15'}};
const S={},T={},TT={};
const reg=(k,t,title,fn)=>{S[k]=fn;T[k]=t;TT[k]=title};
const CT=(...a)=>`<div class="ctr">${a.map((x,i)=>/^<\w+[^>]*style="/.test(x)?x.replace(/^(<\w+[^>]*?)style="/,'$1style="--i:'+i+';'):x.replace(/^<(\w+)/,'<$1 style="--i:'+i+'"')).join('')}</div>`;
const gap=h=>`<div style="height:${h}cqh;opacity:0"></div>`;
// ---------- T: innings & events ----------
reg('t1','Innings Start','',d=>`<div class="curtain l"></div><div class="curtain r"></div>`+CT(`<div class="k" style="font-size:2.4cqw">INNINGS 1 · 20 OVERS</div>`,`<div class="hug gold">${up(d.sc.a)}</div>`,`<div class="mid">TO BAT</div>`,`<div class="sm">${up(d.sc.b)} TO BOWL</div>`));
const PP=[7,12,9,14,6,8];
reg('t2','Powerplay End','POWERPLAY COMPLETE',d=>`<svg viewBox="0 0 600 120" style="position:absolute;left:12cqw;top:20cqh;width:76cqw">${PP.map((v,i)=>`<rect class="growx" style="--i:${i}" x="${i*100+4}" y="40" width="92" height="40" rx="6" fill="${v>10?'#ffd45a':'#5bc8f5'}"/><text x="${i*100+50}" y="68" fill="#06182a" font-size="26" font-weight="900" text-anchor="middle" font-family="var(--f)">${v}</text><text x="${i*100+50}" y="105" fill="#9fb2c7" font-size="16" text-anchor="middle" font-family="var(--f)">OV ${i+1}</text>`).join('')}</svg>`+CT(gap(40),`<div class="hug gold" style="font-size:9cqw">56/1</div>`,`<div class="mid">${up(d.sc.a)} · RUN RATE 9.33</div>`));
reg('t3','Drinks Break','DRINKS BREAK',d=>CT(`<svg class="ringt" style="--dur:8s" viewBox="-60 -60 120 120"><circle r="50" stroke="#17304d"/><circle class="fg" pathLength="1" r="50" stroke="#5bc8f5" transform="rotate(-90)"/><text y="8" fill="#fff" font-size="26" font-weight="900" text-anchor="middle" font-family="var(--f)">2:00</text></svg>`,`<div class="mid">PLAY RESUMES SHORTLY</div>`,`<div class="sm">${up(d.sc.a)} 98/3 · 11.2 OV</div>`));
reg('t4','Strategic Timeout','STRATEGIC TIMEOUT',d=>CT(`<svg class="ringt fk" viewBox="-60 -60 120 120"><polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="none" stroke="#ffd45a" stroke-width="3"/><g style="animation:spn 8s linear infinite"><line y2="-38" stroke="#fff" stroke-width="3"/></g><circle r="4" fill="#ffd45a"/></svg>`,`<div class="hug gold" style="font-size:6cqw">2:30</div>`,`<div class="mid">${up(d.sc.a)} 62/1 · 6.0 OV</div>`));
reg('t5','Innings Break','INNINGS BREAK',d=>`<div class="ib a pan"><div class="k">${up(d.sc.a)}</div><div class="hug gold" style="font-size:9cqw">${d.sc.score}</div><div class="sm">${d.sc.ov} OV · RR ${d.sc.rr}</div></div><div class="ib b pan"><div class="k">${up(d.sc.b)} NEED</div><div class="hug" style="font-size:9cqw;color:#ff6d86">${d.sc.tgt}</div><div class="sm">IN 20 OVERS · RRR 12.20</div></div>`);
reg('t6','Super Over','SUPER OVER',d=>`<svg class="bolt fk" viewBox="0 0 40 70" style="position:absolute;left:45cqw;top:16cqh;width:10cqw"><path d="M24 0 8 38h12L14 70 34 28H22z" fill="#ffd45a"/></svg>`+CT(gap(28),`<div class="hug gold" style="font-size:8cqw">SUPER OVER</div>`,`<div class="mid">TIED AT 219</div>`,`<div class="sm">SIX BALLS · ONE BATTING PAIR · TWO WICKETS</div>`));
reg('t7','Rain Delay','RAIN DELAY',d=>`<div class="rain">${Array.from({length:60},(_,i)=>`<i style="left:${(i*17)%100}%;--d:${(i%10)*.1}s"></i>`).join('')}</div>`+CT(`<svg viewBox="0 0 120 70" style="width:20cqw"><path d="M30 55a20 20 0 1 1 6-39 26 26 0 0 1 50 6 17 17 0 0 1 4 33z" fill="#6c86a6" stroke="#cfe3f7" stroke-width="2"/></svg>`,`<div class="hug" style="font-size:8cqw;color:#cfe3f7">RAIN DELAY</div>`,`<div class="mid gold">COVERS ARE ON</div>`,`<div class="sm">${up(d.sc.b)} 62/2 · 7.4 OV · DLS PAR 71</div>`));
reg('t8','Play Resumes','PLAY RESUMES',d=>`<div style="position:absolute;left:50%;top:60%;width:120cqw;height:120cqw;margin:-60cqw;background:repeating-conic-gradient(from 0deg,#ffe27a33 0 5deg,transparent 5deg 18deg);border-radius:50%;animation:spn2 30s linear infinite"></div>`+CT(`<div class="hug gold" style="font-size:8cqw">PLAY RESUMES</div>`,`<div class="mid">REVISED TARGET ${d.sc.tgt-18} FROM 16 OVERS</div>`,`<div class="sm">DLS METHOD · ${up(d.sc.b)} NEED 94 FROM 54</div>`));
reg('t9','Innings Close','INNINGS CLOSE',d=>CT(`<div class="k" style="font-size:2.4cqw">${up(d.sc.a)} · INNINGS 1</div>`,`<div class="hug gold" style="font-size:12cqw"><span class="type" style="display:inline-block;vertical-align:bottom">${d.sc.score}</span></div>`,`<div class="mid">${d.sc.ov} OVERS · RUN RATE ${d.sc.rr}</div>`,`<div class="sm">9 FOURS · 5 SIXES · EXTRAS 11</div>`));
reg('t10','Match Interruption','PLAY SUSPENDED',d=>`<div class="stripe" style="top:18cqh"></div><div class="stripe" style="bottom:12cqh"></div>`+CT(`<div class="hug" style="font-size:8cqw;color:#ffd45a">PLAY SUSPENDED</div>`,`<div class="mid">FLOODLIGHT FAILURE · SECTION B</div>`,`<div class="sm">UMPIRES AND MATCH REFEREE INSPECTING · UPDATE IN 15 MINUTES</div>`));
// ---------- W: tournament ----------
const TB=[['Sky High Kings',10,8,2,16,1.42],['Ganga Giants',10,7,3,14,.88],['Hapur Hawks',10,6,4,12,.35],['Delhi Dynamos',10,5,5,10,-.05],['Meerut Mavericks',10,4,6,8,-.41],['Noida Nighthawks',10,2,8,4,-1.2]];
const row=(t,i,pos,q,extra='')=>`<div class="tcol ${q?'q':''}" style="--i:${i};${extra}"><span>${pos}</span><span>${t[0]}</span><b>${t[1]}</b><b>${t[2]}</b><b>${t[3]}</b><b style="color:var(--gold2)">${t[4]}</b></div>`;
reg('w1','Points Table','POINTS TABLE',d=>`<div class="tbl" style="gap:.9cqh"><div class="tcol h"><span></span><span>TEAM</span><b>P</b><b>W</b><b>L</b><b>PTS</b></div>${TB.map((t,i)=>row(t,i,i+1,i<4)).join('')}</div>`);
reg('w2','Group Standings','GROUP STANDINGS',d=>`<div style="position:absolute;left:5cqw;width:43cqw;top:22cqh"><div class="k" style="margin-bottom:1cqh">GROUP A</div>${TB.slice(0,4).map((t,i)=>row(t,i,i+1,i<2,'margin-bottom:.8cqh;font-size:1.5cqw;grid-template-columns:2cqw 1fr 4cqw 4cqw 4cqw 5cqw')).join('')}</div><div style="position:absolute;right:5cqw;width:43cqw;top:22cqh"><div class="k" style="margin-bottom:1cqh">GROUP B</div>${TB.slice(2,6).map((t,i)=>row(t,i+4,i+1,i<2,'margin-bottom:.8cqh;font-size:1.5cqw;grid-template-columns:2cqw 1fr 4cqw 4cqw 4cqw 5cqw')).join('')}</div>`);
reg('w3','Net Run Rate','NET RUN RATE',d=>`<div class="pan" style="left:8cqw;right:8cqw;top:22cqh;bottom:10cqh;padding:2cqw"><svg viewBox="-300 0 600 300" style="width:100%;height:100%"><line x1="0" x2="0" y1="0" y2="300" stroke="#ffffff55"/>${TB.map((t,i)=>{const w=Math.abs(t[5])/1.5*260,x=t[5]>=0?0:-w;return `<rect class="growx" style="--i:${i};transform-origin:${t[5]>=0?'left':'right'}" x="${x}" y="${i*48+6}" width="${w}" height="34" rx="4" fill="${t[5]>=0?'#2cff8a':'#ff4d6d'}"/><text x="${t[5]>=0?-8:8}" y="${i*48+30}" fill="#fff" font-size="20" font-weight="700" text-anchor="${t[5]>=0?'end':'start'}" font-family="var(--f)">${up(t[0])}</text><text x="${t[5]>=0?w+8:-w-8}" y="${i*48+30}" fill="#ffd45a" font-size="20" font-weight="800" text-anchor="${t[5]>=0?'start':'end'}" font-family="var(--f)">${t[5]>0?'+':''}${t[5]}</text>`}).join('')}</svg></div>`);
reg('w4','Tournament Bracket','KNOCKOUT BRACKET',d=>{const bx=(x,y,a,b,i)=>`<g class="pop" style="--i:${i}"><rect x="${x}" y="${y}" width="150" height="46" rx="5" fill="#0c1c30" stroke="#bf8c38"/><text x="${x+8}" y="${y+19}" fill="#fff" font-size="15" font-weight="700" font-family="var(--f)">${up(a)}</text><text x="${x+8}" y="${y+39}" fill="#fff" font-size="15" font-weight="700" font-family="var(--f)">${up(b)}</text></g>`;return `<svg viewBox="0 0 700 300" style="position:absolute;left:10cqw;top:22cqh;width:80cqw"><g fill="none" stroke="#e6bd6a" stroke-width="2"><path class="drw" pathLength="1" d="M150 25 H200 V70 H250" style="--i:2"/><path class="drw" pathLength="1" d="M150 95 H200 V70" style="--i:2"/><path class="drw" pathLength="1" d="M150 175 H200 V225 H250" style="--i:2"/><path class="drw" pathLength="1" d="M150 245 H200 V225" style="--i:2"/><path class="drw" pathLength="1" d="M400 70 H450 V150 H500" style="--i:4"/><path class="drw" pathLength="1" d="M400 225 H450 V150" style="--i:4"/></g>${bx(0,2,'Kings','Dynamos',0)}${bx(0,72,'Giants','Hawks',0)}${bx(0,152,'Lions','Avengers',1)}${bx(0,222,'Mavericks','Nighthawks',1)}${bx(250,47,'Winner QF1','Winner QF2',3)}${bx(250,202,'Winner QF3','Winner QF4',3)}${bx(500,127,'Finalist 1','Finalist 2',5)}</svg>`});
reg('w5','Qualification Race','QUALIFICATION RACE',d=>`<svg viewBox="0 0 700 300" style="position:absolute;left:8cqw;top:22cqh;width:84cqw">${TB.map((t,i)=>`<line x1="150" x2="650" y1="${i*46+22}" y2="${i*46+22}" stroke="#ffffff22"/><text x="0" y="${i*46+28}" fill="#fff" font-size="16" font-weight="700" font-family="var(--f)">${up(t[0])}</text><circle class="rc" style="--i:${i};--x:${t[4]/16*400}px" r="12" cx="150" cy="${i*46+22}" fill="${i<4?'#2cff8a':'#ff4d6d'}"/>`).join('')}<line x1="470" x2="470" y1="0" y2="280" stroke="#ffd45a" stroke-width="3" stroke-dasharray="8 6"/><text x="470" y="296" fill="#ffd45a" font-size="15" text-anchor="middle" font-family="var(--f)">TOP 4 LINE</text></svg>`);
reg('w6','Top Scorers','ORANGE CAP',d=>`<div class="pan" style="left:8cqw;right:8cqw;top:22cqh;bottom:8cqh;padding:2cqw"><svg viewBox="0 0 800 300" style="width:100%;height:100%">${[['Aarav Sharma',612],['Rohan Mehta',544],['Kabir Singh',498],['Vihaan Rao',430],['Ishaan Verma',401]].map((p,i)=>`<rect class="grow" style="--i:${i}" x="${i*160+20}" y="${270-p[1]/612*230}" width="120" height="${p[1]/612*230}" rx="6" fill="${i?'#e08a2a':'#ffd45a'}"/><text x="${i*160+80}" y="${262-p[1]/612*230}" fill="#fff" font-size="26" font-weight="900" text-anchor="middle" font-family="var(--f)">${p[1]}</text><text x="${i*160+80}" y="292" fill="#9fb2c7" font-size="15" text-anchor="middle" font-family="var(--f)">${up(p[0])}</text>`).join('')}</svg></div>`);
reg('w7','Top Wicket Takers','PURPLE CAP',d=>[['Imran Qureshi',21],['Dev Rathi',18],['Neel Iyer',16]].map((p,i)=>`<div class="grow" style="--i:${[2,3,4][i]};position:absolute;left:${[38,12,64][i]}cqw;width:24cqw;bottom:14cqh;height:${[34,26,20][i]}cqh;background:linear-gradient(#7a3fd0,#2f1566);border:.2cqw solid var(--gold);text-align:center;padding-top:1.4cqh;box-sizing:border-box"><b style="font:900 5cqw/1 var(--f);color:var(--gold2)">${p[1]}</b><div style="font:700 1.5cqw/1.1 var(--f);margin-top:1cqh">${up(p[0])}</div></div>`).join(''));
