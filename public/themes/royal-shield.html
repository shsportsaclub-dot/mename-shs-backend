<!doctype html><html><head><meta charset="utf-8"><title>Royal Shield</title>
<style>
:root{--f:'Barlow Condensed','Arial Narrow','DejaVu Sans',sans-serif;--gold:#e6bd6a;--gold2:#fff3ba;--gold3:#bf8c38;--navy:#075bb6;--ink:#0c1729;--red:#d32f4a;--cy:#5bc8f5}

.hd b{font:800 2.4cqw/1 var(--f);letter-spacing:.3cqw}.hd span{color:var(--gold);font:600 1.5cqw/1 var(--f);letter-spacing:.3cqw;text-transform:uppercase}
.ttl{position:absolute;left:0;right:0;top:11cqh;text-align:center;font:800 4.6cqw/1 var(--f);letter-spacing:.4cqw;text-transform:uppercase;background:linear-gradient(180deg,var(--gold2),var(--gold) 50%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0}
.sc{position:absolute;inset:0;display:none}.sc.on{display:block}
.in .hd{animation:dn .7s .1s both}.in .ttl{animation:dn .8s .25s both}

@keyframes dn{to{opacity:1;transform:none}}@keyframes ot{to{opacity:0;transform:translateZ(400px) scale(1.06)}}
.shield{position:absolute;background:linear-gradient(#101f33f2,#0a1524f2);clip-path:polygon(5% 0,95% 0,100% 7%,100% 100%,0 100%,0 7%)}
.shield:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--gold2),var(--gold3) 45%,var(--gold));clip-path:polygon(5% 0,95% 0,100% 7%,100% 100%,0 100%,0 7%,.4cqw 7%,.4cqw calc(100% - .4cqw),calc(100% - .4cqw) calc(100% - .4cqw),calc(100% - .4cqw) 7%,95% .4cqw,5% .4cqw,.4cqw 7%)}
/* TOSS */

@keyframes rise{to{opacity:1;transform:none}}
.tw{position:absolute;left:0;right:0;top:12%;text-align:center;font:800 2.5cqw/1 var(--f);text-transform:uppercase}
.el{position:absolute;left:0;right:0;top:34%;text-align:center;font:800 2.8cqw/1 var(--f);color:var(--cy);text-transform:uppercase}
.coin{position:absolute;left:50%;bottom:9%;width:9cqw;height:9cqw;margin-left:-4.5cqw;transform-style:preserve-3d}

.coin i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 45%,var(--gold3));display:grid;place-items:center;font:900 2cqw/1 var(--f);color:#3a2600;backface-visibility:hidden;box-shadow:inset 0 0 0 .5cqw #fff3ba88}

@keyframes flip{from{transform:translateY(-34cqh) rotateY(0)}60%{transform:translateY(-8cqh) rotateY(1620deg)}to{transform:translateY(0) rotateY(var(--end,1800deg))}}

.tm.a{left:3cqw;color:#a9dcff}.tm.b{right:3cqw;color:#ffc2cd;text-align:right}
.in .tm{animation:dn .8s .6s both}.tm.w{text-shadow:0 0 3cqw currentColor}
/* XI */
#xi .grid{position:absolute;left:5cqw;right:5cqw;top:24cqh;bottom:9cqh;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr;gap:2.4cqw 1.6cqw;transform-style:preserve-3d}
.pc{position:relative;opacity:0;transform:translateY(8cqh) rotateX(-70deg);transform-origin:top;background:linear-gradient(#142a46,#0b1a2e);border:.2cqw solid var(--gold3);border-radius:1cqw 1cqw .4cqw .4cqw;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:1.4cqh;overflow:hidden}

@keyframes deal{to{opacity:1;transform:none}}
.pc .n{position:absolute;top:.8cqh;left:.8cqw;font:900 1.7cqw/1 var(--f);color:var(--gold)}
.pc .r{position:absolute;top:.8cqh;right:.8cqw;font:700 1.1cqw/1 var(--f);color:#fff;background:var(--red);padding:.2cqw .5cqw;border-radius:.3cqw}
.pc svg{width:62%;margin-bottom:.6cqh}.pc .nm{font:700 2cqw/1.05 var(--f);text-align:center;text-transform:uppercase;padding:0 .5cqw}.pc .ro{font:600 1.15cqw/1 var(--f);color:var(--cy);letter-spacing:.15cqw;margin-top:.4cqh}
/* MATCHUP */
.pl{position:absolute;top:26cqh;width:22cqw;text-align:center;opacity:0}
.pl.a{left:9cqw;transform:translateX(-12cqw)}.pl.b{right:9cqw;transform:translateX(12cqw)}
.in .pl{animation:sl .9s .5s cubic-bezier(.2,.9,.2,1) both}@keyframes sl{to{opacity:1;transform:none}}
.ph{width:17cqw;height:17cqw;margin:0 auto;border-radius:50%;border:.5cqw solid var(--c);background:radial-gradient(circle at 50% 30%,#1c3550,#0a1626);overflow:hidden;box-shadow:0 0 3cqw var(--c)}
.ph svg{width:100%;height:100%}
.role{font:800 2.4cqw/1 var(--f);margin-top:2cqh;letter-spacing:.3cqw}.pn{font:700 2.1cqw/1 var(--f);color:var(--gold);margin-top:.8cqh;text-transform:uppercase}.k{font:600 1.7cqw/1 var(--f);margin-top:1.6cqh;color:#dbe7f5}

.hh small{color:var(--gold);font:600 1.6cqw/1 var(--f);letter-spacing:.3cqw}.hh b{font:800 3.2cqw/1 var(--f)}.hh .r{color:var(--cy);font:700 2.6cqw/1 var(--f)}.hh .w{color:#ffb3c1;font:700 2.4cqw/1 var(--f)}
/* MANHATTAN */
#mh .box{position:absolute;left:12cqw;right:12cqw;top:23cqh;bottom:14cqh;background:#08141fe6;border:.15cqw solid #3c566f;border-radius:1cqw}
#mh svg{position:absolute;inset:0;width:100%;height:100%}
.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}.in .bar{animation:gr .6s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*.08s + .6s)}@keyframes gr{to{transform:scaleY(1)}}
.wk{opacity:0}.in .wk{animation:dn .4s both;animation-delay:calc(var(--i)*.08s + 1.2s)}

.in .row{animation:rw .6s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--i)*.1s + .5s)}@keyframes rw{to{opacity:1;transform:none}}.in .row.out{animation-name:rwo}@keyframes rwo{to{opacity:.55;transform:none}}

.pn2{position:absolute;top:31cqh;width:24cqw;text-align:center;opacity:0}.pn2.a{left:12cqw}.pn2.b{right:12cqw}.in .pn2{animation:dn .7s .9s both}
.pn2 b{display:block;font:800 3.4cqw/1 var(--f);text-transform:uppercase}.pn2 span{display:block;font:700 5cqw/1.1 var(--f);margin-top:1cqh}.pn2 small{font:600 1.7cqw/1 var(--f);color:#9fb2c7}
.pn2.a span{color:var(--cy)}.pn2.b span{color:#ffb3c1}
.pm{position:absolute;left:38cqw;right:38cqw;top:32cqh;text-align:center;opacity:0}.in .pm{animation:dn .7s 1.1s both}.pm small{color:var(--gold);font:600 1.6cqw/1 var(--f);letter-spacing:.3cqw}.pm b{display:block;font:900 11cqw/1 var(--f);background:linear-gradient(180deg,var(--gold2),var(--gold),var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}.pm i{font:600 2cqw/1 var(--f);font-style:normal;color:#dbe7f5}
.bar2{position:absolute;left:14cqw;right:14cqw;bottom:20cqh;height:3cqh;border-radius:2cqh;background:#0b1a2e;overflow:hidden;display:flex;opacity:0}.in .bar2{animation:dn .5s 1.3s both}.bar2 i{height:100%;transform-origin:left;transform:scaleX(0)}.in .bar2 i{animation:sx 1.2s 1.5s cubic-bezier(.2,.9,.2,1) both}@keyframes sx{to{transform:none}}
/* SUMMARY / RESULT */
.big{position:absolute;left:0;right:0;text-align:center}

.sm{position:absolute;left:21cqw;right:21cqw;top:28cqh;text-align:center;opacity:0}.in .sm{animation:dn .7s 1s both}
.sm small{font:700 2.2cqw/1 var(--f);color:var(--gold);letter-spacing:.3cqw;text-transform:uppercase}.sm .sc2{font:900 10cqw/1.05 var(--f);margin:1cqh 0}.sm .ov{font:600 2cqw/1 var(--f);color:#9fb2c7}
.sm .ln{display:flex;justify-content:space-around;margin-top:3cqh;font:700 2.1cqw/1.3 var(--f);text-transform:uppercase;text-align:left}.sm .ln span{color:var(--cy);display:block;font-size:1.5cqw;color:var(--gold)}
.rs1{font:900 4.8cqw/1.05 var(--f);text-transform:uppercase;background:linear-gradient(180deg,var(--gold2),var(--gold),var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;margin:2cqh 0}

.ev{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.2cqh}
.ev .nm{font:800 3.4cqw/1 var(--f);text-transform:uppercase;letter-spacing:.2cqw}.ev .st{font:700 2.4cqw/1 var(--f);color:var(--gold);text-transform:uppercase;letter-spacing:.15cqw}.ev .sb{font:600 2cqw/1 var(--f);color:#9fb2c7;text-transform:uppercase}
.num{font:900 25cqw/.9 var(--f);background:linear-gradient(180deg,var(--gold2),var(--gold) 45%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1.5cqh 2cqh #000a)}
.lbl{font:800 6cqw/1 var(--f);letter-spacing:1cqw;text-transform:uppercase}
.ev>*{opacity:0}.in .ev>*{animation:dn .6s .9s both}
/* FOUR: slash + slam from left */
#e4 .num{opacity:0;transform:translateX(-60cqw) skewX(-20deg)}.in #e4 .num{animation:sl4 .7s .3s cubic-bezier(.1,.9,.2,1) both}@keyframes sl4{60%{transform:translateX(3cqw) skewX(-6deg)}to{opacity:1;transform:none}}
#e4 .lbl{color:var(--cy)}.slash{position:absolute;left:-10cqw;right:-10cqw;top:46cqh;height:1.2cqh;background:linear-gradient(90deg,transparent,var(--cy),#fff,var(--cy),transparent);transform:scaleX(0) rotate(-6deg);box-shadow:0 0 3cqw var(--cy)}.in .slash{animation:sx 1s .2s ease-out both}
.ring{position:absolute;left:50%;top:50%;width:20cqw;height:20cqw;margin:-10cqw;border:.5cqw solid var(--cy);border-radius:50%;opacity:0}.in .ring{animation:rp 1.6s .45s ease-out both}.in .ring.r2{animation-delay:.75s}@keyframes rp{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(5)}}

#e6 .num{background:linear-gradient(180deg,#fff,#ff8a5b 45%,#d32f4a);-webkit-background-clip:text;background-clip:text}#e6 .lbl{color:#ff9a7a}
.ball{position:absolute;left:-6cqw;top:70cqh;width:5cqw;height:5cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6b6b,#a01028);box-shadow:0 0 3cqw #ff4d4d}.in .ball{animation:arc 1.8s .1s cubic-bezier(.3,.6,.5,1) both}@keyframes arc{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60cqw,-62cqh) scale(2.2)}100%{transform:translate(118cqw,-10cqh) scale(.4);opacity:0}}
.cf{position:absolute;top:-4cqh;width:1cqw;height:2cqh;opacity:0}.in .cf{animation:fall 3s linear both;animation-delay:var(--d)}@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(112cqh) rotate(var(--r))}}
/* OUT: stumps topple, red */
#eo .lbl{color:#ff4d63;font-size:9cqw}.stm{position:relative;width:16cqw;height:18cqh;margin-bottom:3cqh;display:flex;justify-content:space-between;align-items:flex-end;opacity:0}.in .stm{animation:dn .3s .2s both}
.stm i{width:1.3cqw;height:100%;background:linear-gradient(90deg,#f6e3b0,#b88a3a);border-radius:.4cqw;transform-origin:bottom}.in .stm i:nth-child(1){animation:t1 .9s .5s ease-in both}.in .stm i:nth-child(3){animation:t3 .9s .55s ease-in both}.in .stm i:nth-child(2){animation:t2 1s .45s ease-in both}
@keyframes t1{to{transform:rotate(-82deg)}}@keyframes t3{to{transform:rotate(84deg)}}@keyframes t2{to{transform:rotate(-12deg) translateY(2cqh)}}
.stm b{position:absolute;top:-1.2cqh;width:5.5cqw;height:.8cqh;background:#f6e3b0;border-radius:.4cqw}.stm b.a{left:1cqw}.stm b.b{right:1cqw}.in .stm b.a{animation:ba 1.2s .5s ease-out both}.in .stm b.b{animation:bb 1.2s .5s ease-out both}@keyframes ba{to{transform:translate(-9cqw,-14cqh) rotate(-540deg);opacity:0}}@keyframes bb{to{transform:translate(9cqw,-11cqh) rotate(480deg);opacity:0}}
.in #eo{animation:shk .5s .5s}@keyframes shk{20%{transform:translateX(-1cqw)}40%{transform:translateX(1cqw)}60%{transform:translateX(-.6cqw)}}

.rg{position:relative;width:34cqw;height:34cqw}.rg svg{width:100%;height:100%;transform:rotate(-90deg)}.rg circle{fill:none;stroke-width:14;stroke-linecap:round}.rg .bg{stroke:#14263d}.rg .fg{stroke:url(#gg);stroke-dasharray:628;stroke-dashoffset:628}.in .rg .fg{animation:ringf 1.8s .3s cubic-bezier(.3,.7,.2,1) both}@keyframes ringf{to{stroke-dashoffset:0}}
.rg .num{position:absolute;inset:0;display:grid;place-items:center;font-size:15cqw;line-height:1}
.ev .rg,.ev .rg *{opacity:1}.ev .rg{animation:none!important}
/* HUNDRED: crown burst */
#e100 .num{font-size:30cqw;opacity:0;transform:scale(3)}.in #e100 .num{animation:sl1 .9s .2s cubic-bezier(.2,.9,.2,1) both}@keyframes sl1{to{opacity:1;transform:none}}
.crown{width:14cqw;opacity:0;transform:translateY(-20cqh)}.in .crown{animation:cr .9s .8s cubic-bezier(.2,1.4,.3,1) both}@keyframes cr{to{opacity:1;transform:none}}
.burst{position:absolute;left:50%;top:50%;width:70cqw;height:70cqw;margin:-35cqw;background:repeating-conic-gradient(from 0deg,#ffe27a55 0 4deg,transparent 4deg 15deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 10%,transparent 70%);mask:radial-gradient(circle,#000 10%,transparent 70%);opacity:0}.in .burst{animation:bu 5s .2s linear both}@keyframes bu{0%{opacity:0;transform:rotate(0) scale(.2)}15%{opacity:1}100%{opacity:.7;transform:rotate(90deg) scale(1)}}

/* WAGON WHEEL */
#ww .stage{position:absolute;left:23cqw;right:23cqw;top:17cqh;bottom:12cqh;perspective:1600px}
#ww .pl3{position:absolute;inset:0;transform:rotateX(54deg) rotateZ(-8deg);transform-style:preserve-3d;opacity:0}.in #ww .pl3{animation:wwin 1.2s .3s cubic-bezier(.2,.9,.2,1) both}@keyframes wwin{from{opacity:0;transform:rotateX(90deg) rotateZ(-40deg) scale(.5)}to{opacity:1;transform:rotateX(54deg) rotateZ(-8deg)}}
