<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scoring Heroes | Media Studio</title><style>
:root{font-family:system-ui,Arial;background:#080e25;color:#f8f8fc}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;background:#0b1433;padding:16px;z-index:2;border-bottom:1px solid #324267}.wrap{max-width:1100px;margin:auto}.brand{font-weight:900;letter-spacing:.09em;color:#f2c877}.sub{color:#b4bed3;font-size:13px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}button,select{border:1px solid #53617f;border-radius:10px;padding:10px 14px;background:#162449;color:white;font:inherit}button.active{background:#d92448;border-color:#d92448}main{padding:18px 14px 50px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:18px}.tile{background:#101c3d;border:1px solid #324267;border-radius:18px;overflow:hidden}.tile .content{padding:16px}h2{font-size:21px;line-height:1.25;margin:0 0 12px}p{line-height:1.55}.date{color:#f2c877;font-size:12px;font-weight:800;text-transform:uppercase}.poster{width:100%;aspect-ratio:4/5;background:#091b36;object-fit:contain}.paper{background:#f6f0e4;color:#1b1b1b;padding:22px;margin:14px;border:2px solid #262626}.paper h2{font-family:Georgia,serif;font-size:25px}.paper p{font-family:Georgia,serif}.paper .mast{font:700 14px Georgia,serif;letter-spacing:.12em;border-bottom:3px double #222;padding-bottom:10px}.frame{padding:20px;background:linear-gradient(145deg,#172c62,#621f4d);min-height:180px;border-radius:12px;margin:14px 0}.muted{color:#bac3d5}a{color:#f3ca7d}#status{padding:10px 0;color:#e4c58d} .caps{white-space:pre-wrap} .pill{font-size:11px;border:1px solid #6e7e9b;border-radius:20px;padding:5px 8px} .players{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.players span{background:#25365a;border-radius:20px;padding:5px 10px;font-size:12px}.research{display:inline-block;margin:8px 0;color:#f3ca7d}.reel-stage{min-height:260px;display:grid;place-content:center;text-align:center;padding:22px;background:radial-gradient(circle at 70% 25%,#3158a2,#08132d 65%);border:1px solid #b48b45;border-radius:16px;overflow:hidden}.reel-stage strong{font-size:26px;color:#ffdc8a}.reel-stage p{font-size:20px}.reel-stage.playing{animation:reelPulse 2.2s ease-in-out infinite alternate}@keyframes reelPulse{from{background-size:100% 100%;filter:brightness(.85)}to{background-size:125% 125%;filter:brightness(1.18)}} .paper{background:#f7f4ed!important;color:#16213a!important;padding:22px!important;font-family:Georgia,serif!important}.paper .mast{background:#071b37;color:#f6c967;text-align:center;padding:18px 10px;font-family:Arial,sans-serif;letter-spacing:2px;border-bottom:5px solid #d3a74f}.paper h2{font-family:Georgia,serif;color:#0b2444!important;font-size:clamp(29px,6vw,52px);line-height:1.13;margin:15px 0}.paper p{color:#25324a!important;font-size:clamp(16px,3.8vw,21px);line-height:1.55}.paper .date{color:#9a6725!important}.paper-hero{position:relative;min-height:250px;background:radial-gradient(circle at 65% 30%,#214d84,#07162f 75%);border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;margin:15px 0;padding:24px;color:#fff}.paper-hero:before{content:'';position:absolute;width:260px;height:260px;right:-65px;top:-65px;border:20px solid #ffffff14;border-radius:50%}.paper-hero:after{content:'🏏';position:absolute;right:20px;top:30px;font-size:100px;opacity:.2;transform:rotate(-25deg)}.paper-hero .hero-copy{position:relative;z-index:1}.paper-hero .hero-copy b{display:block;font:800 clamp(24px,5vw,40px)/1.15 Arial,sans-serif;color:#ffe29a}.paper-hero .hero-copy small{display:block;color:#d5e5ff;margin-bottom:10px;font:700 13px Arial,sans-serif;letter-spacing:2px}.paper-hero.has-photo{background-position:center;background-size:cover}.paper-feature{margin:16px 0;background:#08152d;border-radius:12px;overflow:hidden}.paper-feature img{width:100%;display:block;aspect-ratio:4/5;object-fit:contain}.paper-feature figcaption{padding:9px 12px;color:#d5dce8;font:12px Arial,sans-serif}.paper-hero{min-height:160px}.paper-hero:after{content:none}.paper-hero.has-photo:before{background:linear-gradient(0deg,#06142bee,transparent);border:0;border-radius:0;inset:0;width:auto;height:auto}.paper-scores{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.paper-score{background:#fff;border-left:5px solid #c69c43;border-radius:8px;padding:12px;box-shadow:0 3px 14px #0a21451a;font-family:Arial,sans-serif}.paper-score b{display:block;color:#0b2549;font-size:clamp(22px,5vw,33px)}.paper-score span{font-size:13px;color:#394a61;overflow-wrap:anywhere}.paper-kicker{font:800 12px Arial,sans-serif;color:#986b24;letter-spacing:2px;margin-top:14px}.paper-note{font:12px Arial,sans-serif!important;color:#637087!important;border-top:1px solid #cbd2dc;padding-top:12px}.paper-story{columns:1;column-gap:24px}@media(min-width:740px){.paper-story{columns:2}}</style></head><body>
<header class="top"><div class="wrap"><div class="brand"><img id="official-brand" alt="Scoring Heroes official brand" style="display:none;max-width:240px;max-height:74px;object-fit:contain;vertical-align:middle;margin-right:10px"><span id="brand-text">SCORING HEROES</span> <span class="pill">MEDIA STUDIO</span></div><div class="sub">Verified match reports • Auto-updates every 60 seconds</div><div class="tools"><select id="lang" aria-label="Language"></select><button data-tab="social" class="active">Social</button><button data-tab="paper">ePaper</button><button data-tab="reels">Reels</button><button data-tab="news">News</button><button id="refresh">Refresh</button></div></div></header><main class="wrap"><div id="status">Loading match reports…</div><div class="grid" id="feed"></div></main>
<script>
const $=id=>document.getElementById(id);let items=[],tab='social',lastFeedSignature='',lastCheckedAt=0;const AUTO_CHECK_MS=60000;
// Only approved local brand files may be displayed. Never replace with generated art.
const officialBrand={full:'/media-studio/brand/1000976455.png',light:'/media-studio/brand/1000958429.jpg',icon:'/media-studio/brand/1000958430.jpg'};
function verifiedBrandImage(url){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve(i.naturalWidth>0?url:null);i.onerror=()=>resolve(null);i.src=url})}
async function showOfficialBrand(){const url=await verifiedBrandImage(officialBrand.full);if(!url)return;const img=$('official-brand');img.src=url;img.style.display='inline-block';$('brand-text').style.display='none'}
showOfficialBrand();const lang=$('lang');
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=String(text);return x}
function add(parent,tag,cls,text){const x=el(tag,cls,text);parent.append(x);return x}
function photoSvg(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function savePng(item){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=1080;c.height=1350;c.getContext('2d').drawImage(im,0,0,1080,1350);c.toBlob(bl=>{if(!bl)return;const u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download='scoring-heroes-'+item.mid+'.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)},'image/png')};im.src=photoSvg(item.posterSvg)}
function addResearch(body,item){if(item.players?.length){const title=add(body,'div','paper-kicker','VERIFIED SCORECARD PLAYERS');const p=add(body,'div','players');for(const x of item.players.slice(0,8))add(p,'span','',x.name+' · '+x.team)}}
function buildPaper(paper,item){const ep=item.epaper||{};verifiedBrandImage(officialBrand.light).then(url=>{if(url){const logo=document.createElement('img');logo.src=url;logo.alt='Official Scoring Heroes logo';logo.style.cssText='width:100%;max-height:115px;object-fit:contain;margin:0 auto 12px';paper.prepend(logo)}});add(paper,'div','mast','SCORING HEROES  |  SPORTS DESK');add(paper,'div','date',item.date||'');add(paper,'div','paper-kicker','MATCH REPORT  /  '+(item.verified?'VERIFIED RESULT':'RESULT'));add(paper,'h2','',ep.title||item.h);add(paper,'p','',ep.subtitle||'');const figure=add(paper,'figure','paper-feature');figure.style.margin='16px 0';const graphic=add(figure,'img','');graphic.alt='Scoring Heroes match-specific graphic for '+(item.h||'match');graphic.loading='lazy';const approvedPhoto=ep.photo||item.photo;const hasApprovedPhoto=Boolean(approvedPhoto?.url&&approvedPhoto?.approved&&approvedPhoto?.license&&approvedPhoto?.attribution&&/^https:\/\//.test(approvedPhoto.url));graphic.src=hasApprovedPhoto?approvedPhoto.url:(item.posterSvg?photoSvg(item.posterSvg):'');if(!graphic.src)figure.style.display='none';add(figure,'figcaption','',hasApprovedPhoto?'Licensed match photo • '+approvedPhoto.attribution:'Original match illustration • Not an actual match photograph');const hero=add(paper,'div','paper-hero');const copy=add(hero,'div','hero-copy');add(copy,'small','','MATCH DAY HIGHLIGHT');add(copy,'b','',item.h||'Match result');const photo=ep.photo||item.photo;if(photo?.url&&photo?.approved&&/^https:\/\//.test(photo.url)){hero.style.backgroundImage='linear-gradient(0deg,#06142bee,#06142b22),url("'+photo.url.replace(/["\\]/g,'')+'")';hero.classList.add('has-photo')}const scoreArea=add(paper,'div','paper-scores');const entries=String(item.sub||'').split(/\s*\|\s*/).slice(0,2);for(const entry of entries){const match=entry.match(/^(.*?):\s*(\d+\/\d+)\s*\(([^)]*)\)/);if(!match)continue;const box=add(scoreArea,'div','paper-score');add(box,'span','',match[1].replace(/\s+Inning\s*\d+/i,''));add(box,'b','',match[2]);add(box,'span','','Overs: '+match[3])}add(paper,'div','paper-kicker','THE MATCH STORY');const story=add(paper,'div','paper-story');for(const para of ep.body||item.body||[])add(story,'p','',para);addResearch(paper,item);add(paper,'p','paper-note',hasApprovedPhoto?'Photo rights and attribution recorded':'Original graphic illustration; verified licensed player photographs not yet available')}
let newsJobs=null;
let newsQa=null;
async function loadNews(){try{const q=await fetch('/api/news-qa',{cache:'no-store'});newsQa=await q.json()}catch{newsQa=null}try{const r=await fetch('/api/news-jobs?status=all&limit=30',{cache:'no-store'});const j=await r.json();newsJobs=j.jobs||[]}catch{newsJobs=[]}if(tab==='news')render()}
function renderNews(){const feed=$('feed');feed.replaceChildren();if(newsJobs===null){$('status').textContent='Loading news jobs…';loadNews();return}
$('status').textContent=newsJobs.length?newsJobs.length+' news jobs • Google News → AI illustration → auto-publish (each story once)':'No news jobs yet. The pipeline runs automatically every few minutes.';
if(newsQa&&newsQa.ok){const b=add(feed,'article','tile');const c=add(b,'div','content');add(c,'h2','','Live QA report');add(c,'p','caps','Storage: '+newsQa.storage+' • published '+newsQa.published+' • QA passed '+newsQa.qaPassed+' • permanent URLs '+newsQa.withPermanentUrl+' • AI images '+newsQa.aiImages+' • graphic fallbacks '+newsQa.fallbackGraphics+' • duplicate images '+newsQa.duplicateImages+' • manual review '+newsQa.review+' • providers: '+(newsQa.providers.join(', ')||'none'))}
for(const j of newsJobs){const card=add(feed,'article','tile');if(j.status==='published'){const img=add(card,'img','poster');img.src='/api/news-poster?job='+encodeURIComponent(j.jobId);img.alt=j.title;img.loading='lazy'}const body=add(card,'div','content');add(body,'div','date','Job '+j.jobId+' • '+j.status.toUpperCase());add(body,'h2','',j.title);add(body,'p','caps',j.caption||'');add(body,'p','muted','Source: '+(j.source&&j.source.name||'—')+(j.source&&j.source.publishedAt?' • '+String(j.source.publishedAt).slice(0,10):''));const chk=add(body,'p','muted','Live check: …');const probe=(u)=>new Promise(r=>{if(!u)return r('—');const i=new Image();i.onload=()=>r(i.naturalWidth>0?'OK':'broken');i.onerror=()=>r('broken');i.src=u});if(j.status==='published')Promise.all([probe('/api/news-poster?job='+encodeURIComponent(j.jobId)),probe(j.posterAssetUrl)]).then(([a,b])=>{chk.textContent='Live check: poster '+a+' • permanent URL '+(j.posterAssetUrl?b:'not configured')+' • QA '+(j.qa?(j.qa.passed?'passed':'FAILED: '+j.qa.failed.join(', ')):'n/a')});else chk.textContent='Status: '+j.status;
add(body,'p','muted',(j.image&&j.image.status==='generated'?(j.image.disclosure||'AI-generated illustration'):'Original Scoring Heroes graphic')+(j.publishedAt?' • published '+new Date(j.publishedAt).toLocaleString():''))}}
function render(){if(tab==='news')return renderNews();const feed=$('feed');feed.replaceChildren();if(!items.length){$('status').textContent='No verified match reports found in the last four days.';return} $('status').textContent=items.length+' verified match reports • '+(tab==='reels'?'Storyboards only — video and audio are not yet available':'Match-specific content');for(const item of items){const card=add(feed,'article','tile');if(tab==='social'){if(item.posterSvg){const img=add(card,'img','poster');img.src=photoSvg(item.posterSvg);img.alt=item.h||'Match poster';img.loading='lazy'}const body=add(card,'div','content');add(body,'div','date',item.date);add(body,'h2','',item.h);add(body,'p','caps',item.social?.caption||item.sub);addResearch(body,item);const btn=add(body,'button','', 'Save poster (PNG)');btn.onclick=()=>savePng(item);const btn2=add(body,'button','','Save SVG');btn2.style.marginLeft='8px';btn2.onclick=()=>{const a=document.createElement('a');a.href=photoSvg(item.posterSvg);a.download='scoring-heroes-'+item.mid+'.svg';a.click()}}else if(tab==='paper'){const paper=add(card,'div','paper');buildPaper(paper,item)}else{const body=add(card,'div','content');add(body,'div','date',item.date);add(body,'h2','',item.h);const frames=item.reel?.frames||[];const stage=add(body,'div','reel-stage');stage.style.aspectRatio='9/16';stage.style.maxHeight='580px';stage.style.position='relative';stage.style.border='2px solid #e4b65f';verifiedBrandImage(officialBrand.icon).then(url=>{if(url){stage.style.backgroundImage='linear-gradient(145deg,#08132dcc,#08132dee),url("'+url+'")';stage.style.backgroundSize='cover';stage.style.backgroundPosition='center'}});let index=0;const show=()=>{const f=frames[index%frames.length];if(!f)return;stage.replaceChildren();add(stage,'div','date','SCORING HEROES • MATCH HIGHLIGHTS');add(stage,'strong','',f.title);add(stage,'p','',f.caption);add(stage,'div','paper-kicker','VERIFIED MATCH DATA')};show();const play=add(body,'button','','Play animated reel preview');play.onclick=()=>{if(!frames.length)return;stage.classList.add('playing');play.disabled=true;let n=0;const next=()=>{if(n>=frames.length){stage.classList.remove('playing');play.disabled=false;return}index=n++;show();setTimeout(next,Math.max(1,Number(frames[index].durationSeconds)||3)*1000)};next()};addResearch(body,item);add(body,'p','muted','Animated storyboard preview only. No verified match video or MP4 export yet.')}}}
async function load({silent=false}={}){try{if(!silent)$('status').textContent='Loading…';const resp=await fetch('/api/media-studio?lang='+encodeURIComponent(lang.value||'en'),{cache:'no-store'});if(!resp.ok)throw Error('HTTP '+resp.status);const data=await resp.json();const next=data.items||[];const signature=next.map(x=>[x.mid,x.h,x.posterSvg?.length,x.date].join(':')).join('|');lastCheckedAt=Date.now();if(silent&&signature===lastFeedSignature)return;lastFeedSignature=signature;items=next;if(data.languageSelection?.fallback)$('status').textContent='Translation unavailable; showing English';render()}catch(e){if(!silent)$('status').textContent='Unable to load media: '+e.message}}
async function init(){try{const r=await fetch('/api/languages');const d=await r.json();for(const x of d.languages||[]){const opt=el('option');opt.value=x.code;opt.textContent=x.nativeName+' ('+x.name+')'+(x.articleReady?'':' · English fallback');lang.append(opt)}}catch{for(const code of ['en','te','hi']){const o=el('option');o.value=code;o.textContent=code;lang.append(o)}}const pref=localStorage.getItem('sh-language')||navigator.language?.split('-')[0]||'en';lang.value=[...lang.options].some(o=>o.value===pref)?pref:'en';lang.onchange=()=>{localStorage.setItem('sh-language',lang.value);load()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('refresh').onclick=load;await load();setInterval(()=>{if(!document.hidden)load({silent:true})},AUTO_CHECK_MS);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastCheckedAt>AUTO_CHECK_MS)load({silent:true})})}init();
</script></body></html>
