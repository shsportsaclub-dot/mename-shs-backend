<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scoring Heroes | Media Studio</title><style>
:root{font-family:system-ui,Arial;background:#080e25;color:#f8f8fc}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;background:#0b1433;padding:16px;z-index:2;border-bottom:1px solid #324267}.wrap{max-width:1100px;margin:auto}.brand{font-weight:900;letter-spacing:.09em;color:#f2c877}.sub{color:#b4bed3;font-size:13px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}button,select{border:1px solid #53617f;border-radius:10px;padding:10px 14px;background:#162449;color:white;font:inherit}button.active{background:#d92448;border-color:#d92448}main{padding:18px 14px 50px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:18px}.tile{background:#101c3d;border:1px solid #324267;border-radius:18px;overflow:hidden}.tile .content{padding:16px}h2{font-size:21px;line-height:1.25;margin:0 0 12px}p{line-height:1.55}.date{color:#f2c877;font-size:12px;font-weight:800;text-transform:uppercase}.poster{width:100%;aspect-ratio:4/5;background:#091b36;object-fit:contain}.paper{background:#f6f0e4;color:#1b1b1b;padding:22px;margin:14px;border:2px solid #262626}.paper h2{font-family:Georgia,serif;font-size:25px}.paper p{font-family:Georgia,serif}.paper .mast{font:700 14px Georgia,serif;letter-spacing:.12em;border-bottom:3px double #222;padding-bottom:10px}.frame{padding:20px;background:linear-gradient(145deg,#172c62,#621f4d);min-height:180px;border-radius:12px;margin:14px 0}.muted{color:#bac3d5}a{color:#f3ca7d}#status{padding:10px 0;color:#e4c58d} .caps{white-space:pre-wrap} .pill{font-size:11px;border:1px solid #6e7e9b;border-radius:20px;padding:5px 8px} .players{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.players span{background:#25365a;border-radius:20px;padding:5px 10px;font-size:12px}.research{display:inline-block;margin:8px 0;color:#f3ca7d}.reel-stage{min-height:260px;display:grid;place-content:center;text-align:center;padding:22px;background:radial-gradient(circle at 70% 25%,#3158a2,#08132d 65%);border:1px solid #b48b45;border-radius:16px;overflow:hidden}.reel-stage strong{font-size:26px;color:#ffdc8a}.reel-stage p{font-size:20px}.reel-stage.playing{animation:reelPulse 2.2s ease-in-out infinite alternate}@keyframes reelPulse{from{background-size:100% 100%;filter:brightness(.85)}to{background-size:125% 125%;filter:brightness(1.18)}} </style></head><body>
<header class="top"><div class="wrap"><div class="brand">SCORING HEROES <span class="pill">MEDIA STUDIO</span></div><div class="sub">Verified match reports • Last 4 days</div><div class="tools"><select id="lang" aria-label="Language"></select><button data-tab="social" class="active">Social</button><button data-tab="paper">ePaper</button><button data-tab="reels">Reels</button><button id="refresh">Refresh</button></div></div></header><main class="wrap"><div id="status">Loading match reports…</div><div class="grid" id="feed"></div></main>
<script>
const $=id=>document.getElementById(id);let items=[],tab='social';const lang=$('lang');
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=String(text);return x}
function add(parent,tag,cls,text){const x=el(tag,cls,text);parent.append(x);return x}
function photoSvg(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function addResearch(body,item){const r=item.research;if(r?.matchSearchUrl){const a=add(body,'a','research','Research match scorecard');a.href=r.matchSearchUrl;a.target='_blank';a.rel='noopener noreferrer'}if(item.players?.length){const p=add(body,'div','players');for(const x of item.players.slice(0,8))add(p,'span','',x.name+' · '+x.team)}if(r?.playerPhotoSearches?.length){const p=add(body,'div','players');for(const x of r.playerPhotoSearches.slice(0,4)){const a=add(p,'a','','Find photo: '+x.player);a.href=x.searchUrl;a.target='_blank';a.rel='noopener noreferrer'}}}
function render(){const feed=$('feed');feed.replaceChildren();if(!items.length){$('status').textContent='No verified match reports found in the last four days.';return} $('status').textContent=items.length+' verified match reports • '+(tab==='reels'?'Storyboards only — video and audio are not yet available':'Match-specific content');for(const item of items){const card=add(feed,'article','tile');if(tab==='social'){if(item.posterSvg){const img=add(card,'img','poster');img.src=photoSvg(item.posterSvg);img.alt=item.h||'Match poster';img.loading='lazy'}const body=add(card,'div','content');add(body,'div','date',item.date);add(body,'h2','',item.h);add(body,'p','caps',item.social?.caption||item.sub);addResearch(body,item);const btn=add(body,'button','', 'Save poster');btn.onclick=()=>{const a=document.createElement('a');a.href=photoSvg(item.posterSvg);a.download='scoring-heroes-'+item.mid+'.svg';a.click()}}else if(tab==='paper'){const paper=add(card,'div','paper');add(paper,'div','mast','SCORING HEROES  |  SPORTS DESK');add(paper,'div','date',item.date);add(paper,'h2','',item.epaper?.title||item.h);add(paper,'p','',item.epaper?.subtitle||'');for(const para of item.epaper?.body||item.body||[])add(paper,'p','',para);addResearch(paper,item);if(!item.photo)add(paper,'small','','Photo not available — verified match data only')}else{const body=add(card,'div','content');add(body,'div','date',item.date);add(body,'h2','',item.h);const frames=item.reel?.frames||[];const stage=add(body,'div','reel-stage');let index=0;const show=()=>{const f=frames[index%frames.length];if(!f)return;stage.replaceChildren();add(stage,'strong','',f.title);add(stage,'p','',f.caption)};show();const play=add(body,'button','','Play animated reel preview');play.onclick=()=>{if(!frames.length)return;stage.classList.add('playing');play.disabled=true;let n=0;const next=()=>{if(n>=frames.length){stage.classList.remove('playing');play.disabled=false;return}index=n++;show();setTimeout(next,Math.max(1,Number(frames[index].durationSeconds)||3)*1000)};next()};addResearch(body,item);add(body,'p','muted','Animated browser preview • MP4 export, music and voice are not yet available')}}}
async function load(){try{$('status').textContent='Loading…';const resp=await fetch('/api/media-studio?lang='+encodeURIComponent(lang.value||'en'),{cache:'no-store'});if(!resp.ok)throw Error('HTTP '+resp.status);const data=await resp.json();items=data.items||[];if(data.languageSelection?.fallback)$('status').textContent='Translation unavailable; showing English';render()}catch(e){$('status').textContent='Unable to load media: '+e.message}}
async function init(){try{const r=await fetch('/api/languages');const d=await r.json();for(const x of d.languages||[]){const opt=el('option');opt.value=x.code;opt.textContent=x.nativeName+' ('+x.name+')'+(x.articleReady?'':' · English fallback');lang.append(opt)}}catch{for(const code of ['en','te','hi']){const o=el('option');o.value=code;o.textContent=code;lang.append(o)}}const pref=localStorage.getItem('sh-language')||navigator.language?.split('-')[0]||'en';lang.value=[...lang.options].some(o=>o.value===pref)?pref:'en';lang.onchange=()=>{localStorage.setItem('sh-language',lang.value);load()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('refresh').onclick=load;await load()}init();
</script></body></html>
