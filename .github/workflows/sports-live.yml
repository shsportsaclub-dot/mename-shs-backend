name: Verify multi-sport live sharing
on:
  push:
    branches: [main]
    paths: [server.js, app-index.html, tests/sports-live.cjs, .github/workflows/sports-live.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node --check server.js
      - run: node tests/sports-live.cjs
      - run: node scripts/check-deployed-sports.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sports-live-runtime-evidence
          path: runtime-evidence/
          if-no-files-found: warn
