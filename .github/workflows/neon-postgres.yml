name: Neon Postgres integration
on:
  push:
    branches: [main]
    paths: ['server.js', 'env.mjs', 'neon-postgres.mjs', 'neon.ts', 'package*.json', 'scripts/build.mjs', 'scripts/verify-neon.mjs', 'tests/neon-*.mjs', '.github/workflows/neon-postgres.yml']
  pull_request:
    paths: ['server.js', 'env.mjs', 'neon-postgres.mjs', 'neon.ts', 'package*.json', 'scripts/build.mjs', 'scripts/verify-neon.mjs', 'tests/neon-*.mjs', '.github/workflows/neon-postgres.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:neon
