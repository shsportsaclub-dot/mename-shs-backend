name: Score update commentary
on:
  push:
    paths: ['app-index.html', 'server.js', 'score-update-commentary.cjs', 'tests/score-update*', '.github/workflows/score-update-commentary.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/score-update-commentary.test.cjs tests/score-update-proxy.test.cjs
      - run: npm install --no-save playwright@1.61.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/score-update-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: score-update-evidence
          path: runtime-evidence/score-update*
