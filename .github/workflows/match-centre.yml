name: Match centre checks
on:
  push:
    paths: ['app-index.html', 'tests/match-centre.cjs', '.github/workflows/match-centre.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tests/match-centre.cjs
