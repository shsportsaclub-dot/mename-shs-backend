name: Test SMS OTP adapter
on:
  push:
    branches: [main]
    paths: [server.js, tests/textbee.test.mjs, .github/workflows/sms-otp-tests.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --check server.js
      - run: node --test tests/textbee.test.mjs
      - run: node tests/textbee-burst.test.mjs
