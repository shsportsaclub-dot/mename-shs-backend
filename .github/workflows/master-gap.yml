name: Master gap acceptance
on:
  push:
    branches: [main, fix/master-gap-20261020]
    paths: [app-index.html, tests/master-gap-browser.cjs, tests/live-centre.cjs, .github/workflows/master-gap.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: node --test tests/cricket-fielding.test.cjs tests/scorer-phases.test.cjs tests/delivery-effects.test.cjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/master-gap-browser.cjs
      - run: node tests/live-centre.cjs
      - run: node tests/auction-rules.cjs
      - run: node tests/stream-servers.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: master-gap-evidence
          path: runtime-evidence/master-gap*
