# Keeps the free Render server awake so the live tracker keeps recording balls between visits.
# Free Render sleeps after 15 minutes without traffic; this pings /health every 5 minutes.
name: Keep server awake
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS -m 60 https://scoring-heroes-api.onrender.com/health || echo "server did not answer; it may be waking up"
