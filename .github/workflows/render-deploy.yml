# Optional: deploys the server on Render automatically after every push to main.
# One-time setup: Render > scoring-heroes-api > Settings > Deploy Hook > copy the URL,
# then GitHub > this repo > Settings > Secrets and variables > Actions > New secret named RENDER_DEPLOY_HOOK.
# (Or simply switch Render > Settings > Auto-Deploy to "On Commit"; then this file is not needed.)
name: Deploy to Render
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '.github/workflows/android.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set: skipping (use Render Auto-Deploy or add the secret)"; exit 0; fi
          curl -fsS -X POST "$HOOK" && echo "Render deploy requested"
