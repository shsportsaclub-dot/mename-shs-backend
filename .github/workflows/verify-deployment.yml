name: Verify deployed build
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/update-state.cjs
      - run: node scripts/verify-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-verification
          path: runtime-evidence/deployment-verification.json
